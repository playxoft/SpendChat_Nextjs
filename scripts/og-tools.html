<!doctype html>
<!--
  Source for public/og/tools/<slug>.png — the 1200x630 preview card shown when
  a /tools page is shared (WhatsApp, X, Slack…), one per tool plus `index` for
  the /tools hub. Same look as scripts/og-image.html, plus the tool's name and
  a worked example, so the preview says what the link does.

  Static PNGs on purpose (see og-image.html): no runtime image generation in
  the Worker. To regenerate after editing, run from the repo root (needs
  Chrome; keep each result <300 KB):

    for s in index invoice-generator quotation-generator percentage-calculator \
      vat-calculator amount-in-words electricity-cost-calculator days-between-dates \
      age-calculator compound-interest-calculator sip-calculator credit-card-payoff-calculator; do
      "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
        --headless=new --disable-gpu --hide-scrollbars \
        --force-device-scale-factor=1 --window-size=1200,630 \
        --virtual-time-budget=4000 \
        --screenshot="public/og/tools/$s.png" \
        "file://$PWD/scripts/og-tools.html?t=$s"
    done

  A new tool needs an entry in CARDS below and a run of the loop;
  tests/unit/tools/registry.test.ts fails while a published tool has no PNG.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        background: #0a0a0a;
        color: #fafafa;
        font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px 88px;
        box-shadow: inset 0 0 0 1px #1f1f1f;
      }
      .brand { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 600; letter-spacing: -0.02em; }
      .brand .mark { width: 40px; height: 40px; }
      .brand .crumb { color: #71717a; font-weight: 500; }
      .main { display: flex; align-items: center; justify-content: space-between; gap: 56px; }
      .copy { flex: 1; min-width: 0; }
      .title { font-size: 68px; font-weight: 600; line-height: 1.05; letter-spacing: -0.03em; }
      .sub { margin-top: 22px; font-size: 30px; line-height: 1.3; color: #a1a1aa; max-width: 20ch; }
      .card {
        width: 400px; flex: none;
        border: 1px solid #262626; border-radius: 24px; background: #141414;
        padding: 34px 36px;
      }
      .q { font-family: "Geist Mono", ui-monospace, monospace; font-size: 24px; color: #a1a1aa; line-height: 1.35; }
      .a { margin-top: 16px; font-size: 52px; font-weight: 600; letter-spacing: -0.02em; color: #34d399; line-height: 1.1; }
      .a.long { font-size: 34px; line-height: 1.2; }
      .meta { font-size: 24px; color: #8b8b93; }
      .dot { margin: 0 12px; color: #3f3f46; }
    </style>
  </head>
  <body>
    <div class="brand">
      <svg class="mark" viewBox="0 0 24 24" fill="none">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" fill="none" stroke="#fafafa"
          stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
        <text x="12" y="10.4" text-anchor="middle" dominant-baseline="middle" font-size="9" font-weight="600"
          fill="#fafafa" font-family="Geist, -apple-system, system-ui, sans-serif">$</text>
      </svg>
      SpendChat <span class="crumb">/ Free tools</span>
    </div>

    <div class="main">
      <div class="copy">
        <div class="title" id="title"></div>
        <div class="sub" id="sub"></div>
      </div>
      <div class="card">
        <div class="q" id="q"></div>
        <div class="a" id="a"></div>
      </div>
    </div>

    <div class="meta">Free<span class="dot">•</span>No sign-up<span class="dot">•</span>Runs in your browser</div>

    <script>
      const CARDS = {
        index: ["Free financial calculators", "GST, SIP, invoices, dates and more — all free.", "11 free tools", "GST · SIP · Invoice"],
        "invoice-generator": ["Free Invoice Generator", "Line items, GST or VAT, any currency — save as PDF.", "Invoice INV-0007 · total", "₹37,501.50"],
        "quotation-generator": ["Free Quotation Maker", "Quotes and estimates that turn into invoices.", "Quotation · valid 30 days", "₹85,000.00"],
        "percentage-calculator": ["Percentage Calculator", "X% of Y, increase, decrease and change.", "15% of 200", "= 30"],
        "vat-calculator": ["GST & VAT Calculator", "Add or remove tax, with 70+ countries' rates.", "₹100 + 18% GST", "= ₹118.00"],
        "amount-in-words": ["Amount in Words", "Numbers to words for cheques and invoices.", "₹1,20,000", "One lakh twenty thousand only"],
        "electricity-cost-calculator": ["Electricity Cost Calculator", "What each appliance costs to run.", "1.5-ton AC · 8 h/day · ₹7/kWh", "≈ ₹2,555/month"],
        "days-between-dates": ["Days Between Dates", "Count days, weeks and working days.", "28 Sep → 28 Oct 2026", "30 days"],
        "age-calculator": ["Age Calculator", "Your exact age from your date of birth.", "Born 14 Mar 1990", "36y 6m 14d"],
        "compound-interest-calculator": ["Compound Interest Calculator", "Monthly deposits, any compounding.", "$10,000 + $200/mo · 7% · 10 yrs", "$54,714"],
        "sip-calculator": ["SIP Calculator", "Step-up SIP returns, year by year.", "₹5,000/month · 12% · 10 yrs", "₹11,61,695"],
        "credit-card-payoff-calculator": ["Credit Card Payoff Calculator", "How long to clear it, and the interest.", "$5,000 at 22% APR · $200/mo", "2 yrs 10 mos"],
      };
      const slug = new URLSearchParams(location.search).get("t") || "index";
      const [title, sub, q, a] = CARDS[slug] || CARDS.index;
      document.getElementById("title").textContent = title;
      document.getElementById("sub").textContent = sub;
      document.getElementById("q").textContent = q;
      const answer = document.getElementById("a");
      answer.textContent = a;
      if (a.length > 14) answer.classList.add("long");
      document.title = slug;
    </script>
  </body>
</html>
