<!doctype html>
<!--
  Source for public/blog/<slug>--<name>.png — the illustrations *inside* a blog
  post, rendered by <Figure> (src/components/blog/figure.tsx) at 1200x675.

  Sibling of scripts/blog-image.html, which renders the 1200x630 cover. Same
  reasoning applies: static PNGs written ahead of time, not next/og at runtime,
  because generating them in the app makes OpenNext bundle @vercel/og +
  resvg.wasm (~2.2 MB) into the Worker and serves every image through a Worker
  invocation instead of straight off Cloudflare's CDN.

  One file renders every figure. The id is read from the query string
  (?fig=<slug>--<name>) and looked up in the FIGURES table at the bottom. Three
  layouts cover everything so far:

    compare — two columns, each a claim with supporting lines
    flow    — three numbered steps, left to right
    table   — a header row and body rows

  Adding a figure is an entry in FIGURES plus a <Figure> in the post. Keep the
  `alt` on that <Figure> describing what the picture *says*, not that it is a
  picture: the alt text is what a screen reader announces and what Google reads,
  and "diagram" tells neither of them anything.

  To render, run from the repo root (needs Chrome). REGENERATE ALL of them after
  editing this file, since a style change here affects every figure:

    mkdir -p public/blog
    for fig in $(node -e "
      const fs=require('fs');
      const src=fs.readFileSync('scripts/blog-figure.html','utf8');
      const ids=[...src.matchAll(/^        \"([a-z0-9-]+--[a-z0-9-]+)\":/gm)].map(m=>m[1]);
      console.log(ids.join(' '));
    "); do
      "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
        --headless=new --disable-gpu --hide-scrollbars \
        --force-device-scale-factor=1 --window-size=1200,675 \
        --virtual-time-budget=4000 \
        --screenshot="public/blog/$fig.png" \
        "file://$PWD/scripts/blog-figure.html?fig=$fig"
    done

  Keep each file well under 300 KB — these are lazy-loaded below the fold, but a
  post carries two of them and mobile readers pay for both.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* The app's dark-theme tokens, copied from src/app/globals.css (`.dark`),
         same as the covers — a figure should never drift from the palette of
         the product it is explaining. */
      :root {
        --background: oklch(0.145 0 0);
        --card: oklch(0.205 0 0);
        --foreground: oklch(0.985 0 0);
        --muted: oklch(0.269 0 0);
        --muted-foreground: oklch(0.708 0 0);
        --border: oklch(1 0 0 / 10%);
        /* Income accent — the one colour the product allows itself. */
        --accent: #34d399;
        --negative: rgba(255, 255, 255, 0.42);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 675px;
      }
      body {
        position: relative;
        overflow: hidden;
        background: var(--background);
        color: var(--foreground);
        font-family: "Geist", -apple-system, BlinkMacSystemFont, "SF Pro Text",
          "Segoe UI", Roboto, sans-serif;
        box-shadow: inset 0 0 0 1px var(--border);
      }

      .grid {
        position: absolute;
        inset: 0;
        background-image: linear-gradient(
            to right,
            rgba(255, 255, 255, 0.03) 1px,
            transparent 1px
          ),
          linear-gradient(
            to bottom,
            rgba(255, 255, 255, 0.03) 1px,
            transparent 1px
          );
        background-size: 60px 60px;
        -webkit-mask-image: radial-gradient(
          90% 110% at 100% 0%,
          #000 0%,
          transparent 62%
        );
      }
      .glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          58% 72% at 96% 4%,
          rgba(255, 255, 255, 0.06) 0%,
          transparent 60%
        );
      }

      .frame {
        position: relative;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 52px 60px 44px;
      }

      /* ---- Heading ---- */
      .kicker {
        font-size: 18px;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted-foreground);
      }
      h1 {
        margin-top: 12px;
        font-size: 40px;
        font-weight: 600;
        line-height: 1.15;
        letter-spacing: -0.025em;
        max-width: 980px;
        text-wrap: balance;
      }
      h1.long {
        font-size: 34px;
      }

      .stage {
        flex: 1;
        display: flex;
        align-items: center;
        margin-top: 34px;
      }

      /* ---- Footer ---- */
      .foot {
        display: flex;
        align-items: center;
        gap: 9px;
        padding-top: 22px;
        font-size: 17px;
        color: var(--muted-foreground);
      }
      .mark {
        width: 21px;
        height: 21px;
        flex: none;
      }

      /* ---- Layout: compare ---- */
      .compare {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 26px;
        width: 100%;
      }
      .col {
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--card);
        padding: 26px 28px 28px;
        min-height: 340px;
      }
      .col.hi {
        border-color: rgba(52, 211, 153, 0.32);
        box-shadow: inset 0 0 0 1px rgba(52, 211, 153, 0.12);
      }
      .col.ai {
        border-color: rgba(124, 58, 237, 0.4);
        box-shadow: inset 0 0 0 1px rgba(124, 58, 237, 0.16);
      }
      .col-label {
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.015em;
      }
      .col-sub {
        margin-top: 7px;
        font-size: 17px;
        color: var(--muted-foreground);
      }
      .items {
        margin-top: 22px;
        display: flex;
        flex-direction: column;
        gap: 15px;
      }
      .item {
        display: flex;
        gap: 12px;
        font-size: 19px;
        line-height: 1.35;
        color: var(--muted-foreground);
      }
      .bullet {
        flex: none;
        width: 22px;
        height: 22px;
        margin-top: 2px;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 600;
        background: var(--muted);
        color: var(--muted-foreground);
      }
      .bullet.yes {
        background: rgba(52, 211, 153, 0.16);
        color: var(--accent);
      }
      .bullet.no {
        background: rgba(255, 255, 255, 0.07);
        color: var(--negative);
      }
      .bullet.ai {
        background: linear-gradient(90deg, #2563eb, #7c3aed);
        color: #fff;
      }

      /* ---- Layout: flow ---- */
      .flow {
        display: flex;
        align-items: stretch;
        gap: 0;
        width: 100%;
      }
      .step {
        flex: 1;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--card);
        padding: 24px 24px 26px;
        min-height: 300px;
        display: flex;
        flex-direction: column;
      }
      .step.ai {
        border-color: rgba(124, 58, 237, 0.4);
      }
      .step.done {
        border-color: rgba(52, 211, 153, 0.32);
      }
      .n {
        width: 34px;
        height: 34px;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 17px;
        font-weight: 600;
        background: var(--muted);
        color: var(--foreground);
      }
      .step.ai .n {
        background: linear-gradient(90deg, #2563eb, #7c3aed);
        color: #fff;
      }
      .step.done .n {
        background: rgba(52, 211, 153, 0.16);
        color: var(--accent);
      }
      .step-label {
        margin-top: 18px;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.012em;
        line-height: 1.2;
      }
      .step-body {
        margin-top: 10px;
        font-size: 17.5px;
        line-height: 1.42;
        color: var(--muted-foreground);
      }
      .mono {
        margin-top: auto;
        padding-top: 18px;
      }
      .mono span {
        display: inline-block;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.04);
        padding: 9px 12px;
        font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 15.5px;
        line-height: 1.35;
        color: var(--foreground);
      }
      .arrow {
        flex: none;
        width: 46px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(255, 255, 255, 0.28);
        font-size: 26px;
      }

      /* ---- Layout: table ---- */
      .table {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 18px;
        overflow: hidden;
        background: var(--card);
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th {
        text-align: left;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--foreground);
        background: rgba(255, 255, 255, 0.045);
        padding: 15px 24px;
        border-bottom: 1px solid var(--border);
      }
      td {
        font-size: 18.5px;
        line-height: 1.35;
        color: var(--muted-foreground);
        padding: 14px 24px;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }
      tr:last-child td {
        border-bottom: 0;
      }
      td.key {
        color: var(--foreground);
        font-weight: 500;
      }
      td.good {
        color: var(--accent);
      }
      /* Rows get tighter as the table gets longer, so seven rows fit the same
         frame as four without the type shrinking to unreadable. */
      .table.rows-6 td,
      .table.rows-7 td {
        padding: 11px 24px;
        font-size: 17.5px;
      }
      .table.rows-8 td,
      .table.rows-9 td {
        padding: 8px 24px;
        font-size: 16.5px;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow"></div>

    <div class="frame">
      <div>
        <div class="kicker" id="kicker"></div>

      </div>

      <div class="stage" id="stage"></div>

      <div class="foot">

            stroke-linejoin="round"
          />
          <text
            x="12"
            y="10.4"
            text-anchor="middle"
            dominant-baseline="middle"
            font-size="9"
            font-weight="600"

            $
          </text>

      </div>

    <script>

        /* ---------- open-source-expense-tracker ---------- */
        "open-source-expense-tracker--hosted-vs-self-hosted": {
          kicker: "Two ways to run it",
          title: "The same code, hosted by us or hosted by you",
          type: "compare",
          left: {
            label: "The hosted app",
            sub: "spendchat.app · free",
            tone: "hi",
            items: [
              { m: "yes", t: "Sign up and log something in under a minute" },

          },
          right: {

            sub: "AGPL-3.0 · your infrastructure",
            tone: "",
            items: [
              { m: "yes", t: "Your database, your storage, your keys" },
              { m: "yes", t: "Point AI entry at whichever provider you prefer" },
              { m: "yes", t: "Fork it — the licence is designed to let you" },

        },
        "open-source-expense-tracker--verifiable-claims": {
          kicker: "Open source as evidence",
          title: "Every privacy claim maps to a file you can open",
          type: "table",
          head: ["The claim", "Where it is decided"],
          rows: [
            ["Reads are scoped to your access", "src/lib/queries.ts, src/lib/rbac.ts"],
            ["No bank integration exists", "grep the repo — there is nothing to find"],
            ["What the AI is sent", "src/lib/ai-*.ts, the prompt is right there"],
            ["Audio is discarded, not stored", "the transcribe route writes nothing"],
            ["Your export is complete", "the CSV builder, and its tests"],
            ["Account deletion really deletes", "the delete action, in one place"],
          ],
        },
      };

      const id = new URLSearchParams(location.search).get("fig");
      const fig = FIGURES[id];

      const el = (tag, cls, text) => {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      };

      function renderCompare(fig, stage) {
        const wrap = el("div", "compare");
        for (const side of [fig.left, fig.right]) {
          const col = el("div", `col ${side.tone || ""}`.trim());
          col.append(el("div", "col-label", side.label));
          if (side.sub) col.append(el("div", "col-sub", side.sub));
          const items = el("div", "items");
          for (const it of side.items) {
            const row = el("div", "item");
            const glyph = it.m === "no" ? "✕" : it.m === "ai" ? "✦" : "✓";
            row.append(el("span", `bullet ${it.m}`, glyph));
            row.append(el("span", null, it.t));
            items.append(row);
          }
          col.append(items);
          wrap.append(col);
        }
        stage.append(wrap);
      }

      function renderFlow(fig, stage) {
        const wrap = el("div", "flow");
        fig.steps.forEach((s, i) => {
          if (i > 0) wrap.append(el("div", "arrow", "→"));
          const step = el("div", `step ${s.tone || ""}`.trim());
          step.append(el("div", "n", s.n));
          step.append(el("div", "step-label", s.label));
          step.append(el("div", "step-body", s.body));
          if (s.mono) {
            const mono = el("div", "mono");
            // Newlines in `mono` are literal line breaks in the chip.
            const chip = el("span");
            s.mono.split("\n").forEach((line, j) => {
              if (j > 0) chip.append(document.createElement("br"));
              chip.append(document.createTextNode(line));
            });
            mono.append(chip);
            step.append(mono);
          }
          wrap.append(step);
        });
        stage.append(wrap);
      }

      function renderTable(fig, stage) {
        const wrap = el("div", `table rows-${fig.rows.length}`);
        const table = document.createElement("table");
        const thead = document.createElement("thead");
        const hr = document.createElement("tr");
        fig.head.forEach((h) => hr.append(el("th", null, h)));
        thead.append(hr);
        const tbody = document.createElement("tbody");
        fig.rows.forEach((cells) => {
          const tr = document.createElement("tr");
          cells.forEach((c, i) => {
            // First column names the thing; "Yes" reads as the accent so the
            // shape of a comparison is legible before any of it is read.
            const cls = i === 0 ? "key" : c === "Yes" ? "good" : null;
            tr.append(el("td", cls, c));
          });
          tbody.append(tr);
        });
        table.append(thead, tbody);
        wrap.append(table);
        stage.append(wrap);
      }

      if (!fig) {
        document.body.innerHTML =
          '<div style="padding:80px;font-size:32px;font-family:sans-serif">Unknown figure: ' +
          (id || "(none)") +
          "</div>";
      } else {
        const titleEl = document.getElementById("title");
        document.getElementById("kicker").textContent = fig.kicker;
        titleEl.textContent = fig.title;
        if (fig.title.length > 52) titleEl.classList.add("long");
        const stage = document.getElementById("stage");
        if (fig.type === "compare") renderCompare(fig, stage);
        else if (fig.type === "flow") renderFlow(fig, stage);
        else renderTable(fig, stage);
      }
    </script>
