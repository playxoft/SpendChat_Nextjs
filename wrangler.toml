name = "spendchat"
main = ".open-next/worker.js"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# Preserve variables and secrets configured on Cloudflare when deploying.
# Without this, `wrangler deploy` treats this file as the single source of truth
# and DELETES any dashboard-managed env vars not listed here — which is how a
# deploy can wipe NEON_* and 500 the app. With keep_vars on, deploys never
# overwrite the variables/secrets you've set on Cloudflare. (Secrets added via
# `wrangler secret put` persist regardless; this also protects dashboard vars.)
keep_vars = true

# ---------------------------------------------------------------------------
# Default (production) environment → `pnpm deploy:prod`.
# Worker `spendchat`, served at spendchat.app.
# Custom domain requires the spendchat.app zone in this Cloudflare account.
# NOTE: top-level keys must appear before any [table] headers in TOML.
# ---------------------------------------------------------------------------
routes = [
  { pattern = "spendchat.app", custom_domain = true },
]

# Static assets emitted by OpenNext
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true

# ---------------------------------------------------------------------------
# Beta (dev) environment → `pnpm deploy:dev` (adds `--env beta`).
# A SEPARATE worker `spendchat-beta` (wrangler suffixes the env name), served at
# beta.spendchat.app. `routes`, `assets` and `observability` are
# non-inheritable in Wrangler, so they're repeated here; `main`,
# `compatibility_*` and `keep_vars` are inherited from the top level.
# ---------------------------------------------------------------------------
[env.beta]

[env.beta.observability]
enabled = true

[env.beta.assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[env.beta.routes]]
pattern = "beta.spendchat.app"
custom_domain = true

# ---------------------------------------------------------------------------
# Secrets/vars are NOT stored here — manage them per worker on Cloudflare
# (dashboard) or via `wrangler secret put`. keep_vars (above) makes deploys
# preserve them. NEXT_PUBLIC_* values are inlined at build time (from Doppler)
# and do NOT need a secret. Set the runtime secrets once per environment:
#
#   # prod worker (spendchat), from the `prd` Doppler config
#   doppler secrets get NEON_POSTGRES_DATABASE_URL --config prd --plain \
#     | npx wrangler secret put NEON_POSTGRES_DATABASE_URL
#
#   # beta worker (spendchat-beta), from the `dev` Doppler config
#   doppler secrets get NEON_POSTGRES_DATABASE_URL --config dev --plain \
#     | npx wrangler secret put NEON_POSTGRES_DATABASE_URL --env beta
# ---------------------------------------------------------------------------
