name = "spendchat"
main = ".open-next/worker.js"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# Preserve variables and secrets configured on Cloudflare when deploying.
# Without this, `wrangler deploy` treats this file as the single source of truth
# and DELETES any dashboard-managed env vars not listed here — which is how a
# deploy can wipe NEON_* and 500 the app. With keep_vars on, deploys never
# overwrite the variables/secrets you've set on Cloudflare. (Secrets added via
# `wrangler secret put` persist regardless; this also protects dashboard vars.)
keep_vars = true

# ---------------------------------------------------------------------------
# There is NO deployable top-level environment: prod and beta are BOTH named
# environments, so every build/deploy must pass `-e|--env` — prod via
# `pnpm deploy:prod` (--env production), beta via `pnpm deploy:dev` (--env beta).
# Wrangler suffixes the env name onto the worker, so the deployed workers are
# `spendchat-production` and `spendchat-beta`. Because both envs are named, a
# plain `wrangler deploy` no longer targets a real prod worker — always go
# through the pnpm scripts.
#
# The top level holds only the INHERITABLE keys both envs share (`main`,
# `compatibility_*`, `keep_vars`). `routes`, `assets`, `observability`,
# `placement` and bindings are non-inheritable in Wrangler, so each env repeats
# them below. `cf-typegen` reads `--env production`, so keep the binding shape
# (HYPERDRIVE, ASSETS, CF_VERSION_METADATA) identical across envs or the
# generated types drift.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Production → `pnpm deploy:prod` (--env production).
# Worker `spendchat-production`, served at spendchat.app.
# Custom domain requires the spendchat.app zone in this Cloudflare account; the
# first deploy moves the spendchat.app custom domain onto this worker.
# ---------------------------------------------------------------------------
[env.production]

# Plain (non-secret) vars, deployed with the worker. APP_ENV tags shipped logs
# as `environment` so BetterStack can filter production vs beta (NODE_ENV is
# "production" on both, so it can't) — see src/lib/logger.ts. keep_vars (above)
# only stops deploys DELETING dashboard vars; vars declared here are still set.
[env.production.vars]
APP_ENV = "production"

[env.production.observability]
enabled = true

[env.production.assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[env.production.routes]]
pattern = "spendchat.app"
custom_domain = true

# Smart Placement runs the Worker close to Neon (single-region DB) instead of
# close to the user, so the per-request Worker↔DB round-trips are fast. Safe and
# reversible — remove this block to revert.
[env.production.placement]
mode = "smart"

# Cloudflare Hyperdrive fronting Neon Postgres (prod). Keeps warm, pooled
# connections to Neon in Cloudflare's network so the Worker skips the
# TCP+TLS+auth handshake per request. Query caching is left disabled — the app
# treats reads as always-fresh (money data). Consumed in src/db/index.ts via
# `env.HYPERDRIVE`.
#
# The `id` below is a Cloudflare resource handle, not a secret: it names a
# config inside this account and is useless without credentials for it. It is
# committed deliberately — a fork replaces it with its own (the command is
# right here) rather than wondering what belongs there.
#
# Create the config once (prod Neon URL, from the `prd` Doppler config), then
# paste the returned id below:
#   doppler run --config prd -- sh -c 'npx wrangler hyperdrive create spendchat-prod \
#     --connection-string="$NEON_POSTGRES_DATABASE_URL" --caching-disabled'
#
# Local `pnpm dev` / `pnpm preview` emulate this binding and need a local
# connection string. The npm scripts derive it from Doppler's
# NEON_POSTGRES_DATABASE_URL (your Neon dev branch) into both
# CLOUDFLARE_/WRANGLER_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE — no local
# Postgres and no committed secret. (`next dev` reads the CLOUDFLARE_ prefix,
# `wrangler dev`/preview the WRANGLER_ one.)
[[env.production.hyperdrive]]
binding = "HYPERDRIVE"
id = "4858a2aa60374cd28c60539f0c0b85e6"

# Deploy identity (worker version id + upload timestamp), reported by
# `GET /api/v1/version` so a bug report can name the exact build. Metadata only —
# it grants no access and costs nothing. Absent until the next deploy, which the
# endpoint reports as `build: null` rather than failing.
[env.production.version_metadata]
binding = "CF_VERSION_METADATA"

# ---------------------------------------------------------------------------
# Beta (dev) → `pnpm deploy:dev` (--env beta).
# Worker `spendchat-beta` (wrangler suffixes the env name), served at
# beta.spendchat.app.
# ---------------------------------------------------------------------------
[env.beta]

# Tags shipped logs as environment="beta" (see the production note above).
[env.beta.vars]
APP_ENV = "beta"

[env.beta.observability]
enabled = true

[env.beta.assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[env.beta.routes]]
pattern = "beta.spendchat.app"
custom_domain = true

# Placement and bindings are non-inheritable, so the beta worker repeats them.
[env.beta.placement]
mode = "smart"

# Separate Hyperdrive config for the beta/dev Neon database (from the `dev`
# Doppler config):
#   doppler run --config dev -- sh -c 'npx wrangler hyperdrive create spendchat-beta \
#     --connection-string="$NEON_POSTGRES_DATABASE_URL" --caching-disabled'
[[env.beta.hyperdrive]]
binding = "HYPERDRIVE"
id = "07826a33089d4b4db1650922ac12da22"

# Same deploy-identity binding as production (see the note there); bindings are
# non-inheritable, so beta repeats it.
[env.beta.version_metadata]
binding = "CF_VERSION_METADATA"

# ---------------------------------------------------------------------------
# Secrets/vars are NOT stored here — manage them PER WORKER on Cloudflare
# (dashboard) or via `wrangler secret put`. keep_vars (above) makes deploys
# preserve them. NEXT_PUBLIC_* values are inlined at build time (from Doppler)
# and do NOT need a secret. Secrets are per-worker, so `spendchat-production`
# and `spendchat-beta` each need their own copies. Set the runtime secrets once
# per environment (repeat for every runtime secret — NEON_POSTGRES_DATABASE_URL,
# R2_*, ZEPTOMAIL_*, MAIL_FROM_*, BETTERSTACK_*, LOG_LEVEL, AI_PARSE_MODEL,
# AI_PARSE_MODEL_CURRENT, AI_TRANSCRIBE_MODEL, AI_TRANSCRIBE_MODEL_CURRENT):
#
# Anything missing from that list fails *quietly* in the worker — the AI ones in
# particular just make the composer's AI mode answer "not available" (and the
# AI_TRANSCRIBE_* pair its mic) — so add a new runtime secret here in the same
# change that reads it.
#
#   # prod worker (spendchat-production), from the `prd` Doppler config
#   doppler secrets get NEON_POSTGRES_DATABASE_URL --config prd --plain \
#     | npx wrangler secret put NEON_POSTGRES_DATABASE_URL --env production
#
#   # beta worker (spendchat-beta), from the `dev` Doppler config
#   doppler secrets get NEON_POSTGRES_DATABASE_URL --config dev --plain \
#     | npx wrangler secret put NEON_POSTGRES_DATABASE_URL --env beta
# ---------------------------------------------------------------------------
