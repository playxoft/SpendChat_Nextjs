name: CLA

# Gates every external pull request on a signed CLA (see CLA.md). This repo is
# open core: the CLA is what lets Playxoft ship contributions in the commercial
# product as well as here, so a PR merged without one is a permanent ambiguity
# in the licence chain — not something to sort out later.
#
# Signatures are recorded in `signatures/cla.json` on the `cla-signatures`
# branch, which the action creates on the first signature. Create that branch
# (empty is fine) before the first external PR, or the first run fails.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# `pull_request_target` runs with a token that can write to this repo, so the
# permissions are stated explicitly and kept to what recording a signature and
# commenting on the PR actually need.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Check CLA signature
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        # Skip the workflow's own bookkeeping comments, and only act on a real
        # signature comment or a pull-request event.
        if: >
          (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
          || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/cla.json"
          path-to-document: "https://github.com/playxoft/SpendChat_Nextjs/blob/master/CLA.md"
          branch: "cla-signatures"
          allowlist: dependabot[bot],github-actions[bot]
          # Must match CONTRIBUTING.md and CLA.md verbatim — the string in the
          # docs is the string contributors will paste.
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-notsigned-prcomment: >
            Thanks for the pull request! Before it can be merged, please read our
            [Contributor License Agreement](https://github.com/playxoft/SpendChat_Nextjs/blob/master/CLA.md)
            and sign it by posting the comment below. You keep the copyright to your
            work — this is a licence grant, not a transfer. Signing is needed only once.
