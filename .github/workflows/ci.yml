name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel in-progress runs for the same ref when new commits are pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for the whole workflow. Without this the job inherits the
# repository default, which on a public repo can hand a fork's pull_request run
# a token with more than it needs. Nothing here writes anything back to GitHub —
# it checks out, installs and runs — so read is the whole requirement. A job
# that ever does need more should declare it on that job, not here.
permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Version comes from package.json's `packageManager` field (pnpm@9.15.0) —
      # the single source of truth. Passing `version:` here too makes
      # action-setup@v4 error on the mismatch ("Multiple versions of pnpm").
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Wrangler (used by cf-typegen below) requires Node >= 22; 20 fails the
          # typegen step. 22 is current LTS and satisfies Next 16 too.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # lint and typecheck need no secrets — they do not run through Doppler.
      - name: Lint
        run: pnpm lint

      # `cloudflare-env.d.ts` is gitignored and generated from wrangler.toml, so
      # it isn't in the checkout. Without it `CloudflareEnv` resolves to an empty
      # interface and typecheck fails on env.HYPERDRIVE / NEON_POSTGRES_DATABASE_URL
      # in src/db/index.ts. `wrangler types` is offline (config → types), so it
      # needs no Cloudflare auth or Doppler secrets.
      - name: Generate Cloudflare env types
        run: pnpm cf-typegen

      - name: Typecheck
        run: pnpm typecheck

      # Lives here rather than in the test job so it reports independently: a PR
      # that both breaks a test and forgets a generated migration should learn
      # both facts in one run, not one per push. Needs nothing the steps above
      # haven't already installed.
      #
      # `--porcelain` rather than `git diff`, because drift shows up as a *new*
      # migration file, which a diff against HEAD would not see. And
      # `db:generate` is guarded: for a rename it wants an interactive prompt,
      # and on a runner it exits non-zero before the message below could print.
      - name: Check for schema drift
        run: |
          pnpm db:generate < /dev/null || {
            echo "::error::pnpm db:generate could not run non-interactively (a rename needs a prompt) — run it locally and commit the result"
            exit 1
          }
          drift="$(git status --porcelain -- src/db/migrations)"
          if [ -n "$drift" ]; then
            echo "::error::schema.ts and src/db/migrations disagree — run pnpm db:generate and commit the result"
            echo "$drift"
            exit 1
          fi

  # Setup below intentionally mirrors lint-and-typecheck; the comments on that
  # job explain why the Node version and the pnpm action are pinned the way they
  # are. Keep the two in step.
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No secrets and no service container: the integration suite runs Postgres
      # in-process via PGlite and applies the real migrations to it, so this also
      # catches a migration that won't replay. Whole run is well under a minute.
      - name: Test
        run: pnpm test
