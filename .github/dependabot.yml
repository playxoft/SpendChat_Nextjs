# Dependency updates. The point is that a security advisory reaches us as a pull
# request rather than as a surprise in someone else's audit — this repo ships a
# money tracker, and "we hadn't noticed" is not an answer anyone accepts.
#
# Weekly rather than daily, and grouped rather than one PR per package, because
# a wall of individual bumps is how a project learns to ignore Dependabot. The
# security updates GitHub raises for a real advisory bypass the grouping and
# arrive on their own, which is the behaviour worth keeping.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # `@types/node` must track `engines.node`, not the newest release: it is
      # the lib `tsc` checks against, so a major ahead of the runtime lets a
      # newer API type-check locally and fail on the deploy. Dependabot proposed
      # ^22 -> ^26 within a day of being switched on, which would have quietly
      # undone that alignment. Raise both together, by hand, when the runtime
      # moves — patch and minor updates still come through.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # esbuild, deliberately, and the same call `package.json`'s `//overrides`
      # note records. Its open advisories are all in esbuild's own DEV SERVER —
      # a CORS hole and a Windows file read — which nothing here ever starts;
      # every consumer uses it as a library.
      #
      # Which copy is flagged is worth stating, because the note this replaces
      # named the wrong one. GHSA-67mh-4wv8-2f99 covers `<= 0.24.2` (patched in
      # 0.25.0). Wrangler pins an exact 0.28.1 and drizzle-kit's own esbuild is
      # 0.25.12 — neither is in range. The single affected copy is 0.18.20,
      # reached only through drizzle-kit -> @esbuild-kit/esm-loader ->
      # @esbuild-kit/core-utils, both of which are themselves deprecated
      # ("Merged into tsx").
      #
      # So there is still nothing to bump, but for a different reason than the
      # old note gave: core-utils declares `~0.18.20`, and forcing it onto 0.25+
      # is exactly the unbounded override that broke @grpc/proto-loader once
      # already. The alert clears when drizzle-kit drops the deprecated
      # @esbuild-kit chain. Revisit then, or if an advisory lands on the
      # library path.
      - dependency-name: "esbuild"
      # `typescript` majors, until typescript-eslint catches up. TypeScript 7
      # is the native rewrite, and typescript-eslint 8 refuses to load against
      # it — `pnpm lint` dies with "typescript-eslint does not support TS 7.0"
      # before it reads a single file, so the whole lint job is gone. We do not
      # pick that dependency ourselves: `eslint-config-next` brings it in, and
      # its peer range is `>=4.8.4 <6.1.0`. Nothing in `tsconfig.json` needs 7
      # (typecheck passes on both), so the upside is a faster `tsc` and the
      # downside is no linting at all. Minor and patch updates still come
      # through. Raise the major by hand once typescript-eslint supports it
      # (https://github.com/typescript-eslint/typescript-eslint/issues/10940).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # `eslint` majors, for the same reason and the same owner. We do not
      # choose our ESLint plugins either — `eslint-config-next` pins
      # eslint-plugin-react, -import and -jsx-a11y, and all three cap their
      # peer range at eslint ^9. On 10 the run dies on the first React file
      # with "contextOrFilename.getFilename is not a function", because
      # eslint-plugin-react still calls a context method ESLint 10 removed.
      # Raise it with `eslint-config-next`, by hand, once that config ships a
      # plugin set that declares eslint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    groups:
      # Next, React and the Cloudflare toolchain move together and are the ones
      # that actually break a build, so they land as one reviewable PR.
      # `@next/*` is here because the patterns are literal, not globs: "next"
      # does not match `@next/mdx`, so without this line it fell through to
      # `production` and a single Next patch arrived as two PRs. `next.config.ts`
      # wraps the whole config in `createMDX(...)`, so merging either PR alone
      # ran the MDX pipeline on a loader built against a different Next patch.
      framework:
        patterns:
          - "next"
          - "@next/*"
          - "eslint-config-next"
          - "react"
          - "react-dom"
          - "@opennextjs/*"
          - "wrangler"
      # Both other groups exclude the framework list explicitly. Dependabot's
      # first-match-wins ordering already keeps `eslint-config-next` and
      # `wrangler` out of `dev-dependencies`, but only while `framework` stays
      # declared first — alphabetizing these blocks would silently move them.
      # Excluding on both sides makes the grouping independent of order.
      dev-dependencies:
        dependency-type: development
        exclude-patterns:
          - "next"
          - "@next/*"
          - "eslint-config-next"
          - "react"
          - "react-dom"
          - "@opennextjs/*"
          - "wrangler"
      production:
        dependency-type: production
        exclude-patterns:
          - "next"
          - "@next/*"
          - "eslint-config-next"
          - "react"
          - "react-dom"
          - "@opennextjs/*"
          - "wrangler"
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
