# Dependency updates. The point is that a security advisory reaches us as a pull
# request rather than as a surprise in someone else's audit — this repo ships a
# money tracker, and "we hadn't noticed" is not an answer anyone accepts.
#
# Weekly rather than daily, and grouped rather than one PR per package, because
# a wall of individual bumps is how a project learns to ignore Dependabot. The
# security updates GitHub raises for a real advisory bypass the grouping and
# arrive on their own, which is the behaviour worth keeping.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # `@types/node` must track `engines.node`, not the newest release: it is
      # the lib `tsc` checks against, so a major ahead of the runtime lets a
      # newer API type-check locally and fail on the deploy. Dependabot proposed
      # ^22 -> ^26 within a day of being switched on, which would have quietly
      # undone that alignment. Raise both together, by hand, when the runtime
      # moves — patch and minor updates still come through.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # esbuild, deliberately, and the same call `package.json`'s `//overrides`
      # note records. Its open advisories are all in esbuild's own DEV SERVER —
      # a CORS hole and a Windows file read — which wrangler and drizzle-kit
      # never start; they use esbuild as a library. Wrangler also pins it to an
      # exact 0.27.3 because it drives the plugin API, so there is no version
      # Dependabot can move to: it reported `patched-versions: []` for all three
      # advisories and the security job failed rather than opening a PR, which
      # is a red run on every retry for a risk we do not carry. Revisit if an
      # advisory ever lands on esbuild's library path.
      - dependency-name: "esbuild"
    groups:
      # Next, React and the Cloudflare toolchain move together and are the ones
      # that actually break a build, so they land as one reviewable PR.
      framework:
        patterns:
          - "next"
          - "eslint-config-next"
          - "react"
          - "react-dom"
          - "@opennextjs/*"
          - "wrangler"
      dev-dependencies:
        dependency-type: development
      production:
        dependency-type: production
        exclude-patterns:
          - "next"
          - "eslint-config-next"
          - "react"
          - "react-dom"
          - "@opennextjs/*"
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
