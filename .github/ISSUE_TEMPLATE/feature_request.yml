name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or pain point behind the request.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        Note: MoneyTracker is intentionally minimal. Some ideas are out of scope
        for the MVP (see the "Out of scope" section in `docs/CHECKLIST.md`).
