name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or pain point behind the request.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        Note: SpendChat is intentionally minimal — a small, fast tracker rather
        than a full accounting package. Bank connections and aggregators are a
        permanent non-goal: see the
        [Privacy & security](https://spendchat.app/features/privacy-and-security)
        page for why.
