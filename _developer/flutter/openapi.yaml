      responses:
        "200":
          description: Deletion acknowledged.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/DeletedResult" } }
                required: [data]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/file-tags:
    get:
      tags: [Files]
      summary: List the vault tags of the accessible profiles
      description: |
        Name-ascending. `?profile=<uuid>` scopes to one profile. Tags are
