  /api/v1/analytics/monthly:
    get:
      tags: [Analytics]
      summary: Income vs expense per month (from required)
      description: Honours only `from` and `profile`.
      parameters:
        - $ref: "#/components/parameters/workspaceHeader"
        - name: from
