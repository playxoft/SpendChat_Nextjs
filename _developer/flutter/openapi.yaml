            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "201":
          description: The created profile.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/Profile" } }
                required: [data]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/profiles/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    patch:
      tags: [Profiles]
      summary: Update a profile (partial, admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpdate" }
      responses:
        "200":
          description: The updated profile.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/Profile" } }
                required: [data]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Profiles]
      summary: Delete a profile (admin only)
      description: >
        `transactions` decides what happens to the transactions filed under the
        profile: `delete` removes them (and their attachments) with it, `move`
        re-files them under `to` first, and `reject` — the default, so a client
        that sends nothing behaves exactly as before — refuses with 409 while
        any remain ("Move this profile's transactions to another profile
        first"). 409 for the last remaining profile ("You need at least one
        profile") whatever the mode.


        The profile's **vault** (files, folders, tags and share links)
        follows the same choice: `move` re-files it under `to`, `delete`
        destroys it. Two collisions resolve automatically — a file-tag whose
        name already exists in the destination is merged into it, so the moved
        tag's id disappears, and the source's predefined "Transaction
        attachments" folder is dropped once its contents are re-parented into
        the destination's.
        Call /profiles/{id}/deletion-impact first to show the counts.
      parameters:
        - name: transactions
          in: query
          required: false
          description: What to do with the profile's transactions.
          schema:
            type: string
            enum: [reject, delete, move]
            default: reject
        - name: to
          in: query
          required: false
          description: >
            Destination profile id. Required when `transactions=move` (422
            otherwise); must be another profile in the same workspace that the
            caller can edit.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Deletion acknowledged.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/DeletedResult" } }
                required: [data]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/profiles/reorder:
    post:
      tags: [Profiles]
      summary: Reorder profiles (admin only)
      parameters:
        - $ref: "#/components/parameters/workspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  description: The full ordered list of this workspace's profile ids.
                  items: { type: string, format: uuid }
                  minItems: 1
                  maxItems: 100
              required: [ids]
      responses:
        "200":
          description: The profiles in their new order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Profile" }
                required: [data]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/profiles/{id}/deletion-impact:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags: [Profiles]
      summary: What deleting this profile would take with it (admin only)
      description: >
        Counts for the delete confirmation. `transactions` is the number whose
        fate the caller chooses (`?transactions=` on DELETE); `attachments` are
        the receipts on those transactions and `files` the profile's vault. All
        three follow the disposal — destroyed on `delete`, moved on `move` — so
        offer the choice whenever `transactions` or `files` is above zero.
      responses:
        "200":
          description: The counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ProfileDeletionImpact" }
                required: [data]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/profiles/{id}/move:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      tags: [Profiles]
      summary: Move this profile's transactions to another profile (editor only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                toProfileId: { type: string, format: uuid }
              required: [toProfileId]
      responses:
        "200":
          description: How many transactions were moved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties: { moved: { type: integer } }
                    required: [moved]
                required: [data]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/settings:
    get:
      tags: [Settings]
      summary: Get settings
      responses:
        "200":
          description: The caller's settings.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/Settings" } }
                required: [data]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Settings]
      summary: Update settings (partial; at least one field)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsPatch" }
      responses:
        "200":
          description: The updated settings.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/Settings" } }
                required: [data]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/analytics/summary:
    get:
      tags: [Analytics]
      summary: Income / expense / balance for the current filters
      parameters:
        - $ref: "#/components/parameters/workspaceHeader"
        - $ref: "#/components/parameters/type"
        - $ref: "#/components/parameters/category"
        - $ref: "#/components/parameters/profile"
        - $ref: "#/components/parameters/from"
        - $ref: "#/components/parameters/to"
        - $ref: "#/components/parameters/q"
      responses:
        "200":
          description: Totals in minor units.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Summary" }
                  meta:
                    type: object
                    properties: { currency: { $ref: "#/components/schemas/CurrencyMeta" } }
                required: [data, meta]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/analytics/categories:
    get:
      tags: [Analytics]
      summary: Totals grouped by category (type required)
      parameters:
        - $ref: "#/components/parameters/workspaceHeader"
        - name: type
          in: query
          required: true
          schema: { type: string, enum: [income, expense] }
        - $ref: "#/components/parameters/profile"
        - $ref: "#/components/parameters/from"
        - $ref: "#/components/parameters/to"
        - $ref: "#/components/parameters/q"
      responses:
        "200":
          description: Category totals in minor units, largest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/CategoryBreakdownItem" }
                  meta:
                    type: object
                    properties: { currency: { $ref: "#/components/schemas/CurrencyMeta" } }
                required: [data, meta]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/analytics/monthly:
    get:
      tags: [Analytics]
      summary: Income vs expense per month (from required)
      description: Honours only `from` and `profile`.
      parameters:
        - $ref: "#/components/parameters/workspaceHeader"
        - name: from
          in: query
          required: true
          description: Inclusive start date, YYYY-MM-DD.
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/profile"
      responses:
        "200":
          description: One point per calendar month (minor units).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/MonthlyPoint" }
                  meta:
                    type: object
                    properties: { currency: { $ref: "#/components/schemas/CurrencyMeta" } }
                required: [data, meta]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/ai/parse:
    post:
      tags: [AI]
      summary: Parse a free-text note into transaction drafts (editor only)
      description: |
        Turns a note like "200 fruits, 100 veg, 1000 electricity, got 5000
        salary" into structured drafts. **Nothing is written** — show the
        drafts for the user to review/edit, then commit the kept ones via
        `POST /transactions/bulk` (map each draft to a `TransactionInput`:
        `type`, `amount`, `title`, `description`, `categoryId`, `occurredOn`).

        Hints the model honours (worth surfacing in the app's UI help):
        `#CategoryName` tags a category, `(parentheses)` become the
        description, relative dates ("yesterday", "last Friday") resolve
        against `timezone`.

        `timezone` (IANA, e.g. `Asia/Kolkata`) anchors "today" for those
        relative dates; omitted → UTC. Send the device zone. Drafts never get
        a future date; `categoryId`/`categoryName` are guaranteed to be an
        existing workspace category of the draft's type, or null.

        Gates, in order: 400 (empty or > 2000-char note, bad timezone),
        403 (viewer in this workspace), 429 (shared 30/hour AI quota),
        503 (parse model not configured), 502 (provider failed). At most 50
        drafts per call; a note that yields nothing usable is a 400.
      parameters:
        - $ref: "#/components/parameters/workspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiParseInput" }
      responses:
        "200":
          description: The parsed drafts, for user review.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      drafts:
                        type: array
                        maxItems: 50
                        items: { $ref: "#/components/schemas/AiDraft" }
                      today:
                        type: string
                        format: date
                        description: The date the server treated as "today" (in the supplied timezone).
                    required: [drafts, today]
                required: [data]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/AiFailed" }
        "503": { $ref: "#/components/responses/AiUnavailable" }

  /api/v1/ai/transcribe:
    post:
      tags: [AI]
      summary: Transcribe a voice note to text (multipart, editor only)
      description: |
        Turns a short voice recording into the text of a note. Returns **only a
        transcript** — put it in the composer for the user to read and fix,
        then send it through `POST /ai/parse` like a typed note. The audio is
        transcribed and discarded; nothing is stored.

        Multipart form data: the recording under `audio`. The part should carry
        its content type; if your HTTP client drops it, send a `mimeType` text
        field as fallback. Accepted containers: `audio/webm`, `audio/ogg`,
        `audio/mp4` (AAC/M4A), `audio/mpeg`, `audio/wav`, `audio/x-wav`,
        `audio/x-m4a`. Max 4 MB (≈ 1 minute — cap recordings at 60 s
        client-side). Amounts come back as digits ("two fifty" → 250, "2 lakh"
        → 200000); spoken languages are transcribed as spoken (never
        translated), guided by the user's `voiceLanguages` setting.

        Gates, in order: 400 (missing/empty/oversized/unsupported audio, or no
        speech heard), 403 (viewer in this workspace), 429 (shared 30/hour AI
        quota), 503 (transcribe model not configured), 502 (provider failed).
      parameters:
        - $ref: "#/components/parameters/workspaceHeader"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                audio: { type: string, format: binary }
                mimeType:
                  type: string
                  description: Fallback content type when the audio part has none.
              required: [audio]
      responses:
        "200":
          description: The transcript (≤ 1200 chars), ready for the composer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      text: { type: string, maxLength: 1200 }
                    required: [text]
                required: [data]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/AiFailed" }
        "503": { $ref: "#/components/responses/AiUnavailable" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase ID token (from firebase_auth's getIdToken()).

  parameters:
    workspaceHeader:
      name: X-Workspace-Id
      in: header
      required: false
      description: >
        Selects the workspace to scope reads/creates to. If omitted, the server
        uses the user's lastWorkspaceId, else the first accessible workspace.
        An unknown id → 404.
      schema: { type: string, format: uuid }
    clientPlatformHeader:
      name: X-Client-Platform
      in: header
      required: false
      description: >
        Optional telemetry header, accepted on every request. Identifies the
        client platform for server-side logging only — it never affects the
        response. Send "android" or "ios"; unknown/absent values are logged as
        "api".
      schema: { type: string, enum: [android, ios, web] }
    id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    type:
      name: type
      in: query
      required: false
      schema: { type: string, enum: [income, expense] }
    category:
      name: category
      in: query
      required: false
      description: Category id, or "all" (no filter).
      schema: { type: string }
    profile:
      name: profile
      in: query
      required: false
      description: Profile id (a UUID scopes to it), or "all"/omitted for every accessible profile.
      schema: { type: string }
    from:
      name: from
      in: query
      required: false
      description: Inclusive start date, YYYY-MM-DD.
      schema: { type: string, format: date }
    to:
      name: to
      in: query
      required: false
      description: Inclusive end date, YYYY-MM-DD.
      schema: { type: string, format: date }
    q:
      name: q
      in: query
      required: false
      description: Free-text search over title + description (ILIKE).
      schema: { type: string }
    limit:
      name: limit
      in: query
      required: false
      description: Page size (default 100, clamped 1–500). Invalid values fall back to 100.
      schema: { type: integer, default: 100, minimum: 1, maximum: 500 }
    offset:
      name: offset
      in: query
      required: false
      schema: { type: integer, default: 0, minimum: 0 }

  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: unauthorized, message: "Missing bearer token" } }
    Forbidden:
      description: Email not verified, or RBAC role too low for the action.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: forbidden, message: "Email not verified" } }
    BadRequest:
      description: Malformed request (e.g. invalid JSON, wrong confirm string).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource/workspace/profile not found or not accessible.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: not_found, message: "Transaction not found" } }
    Conflict:
      description: Conflicts with current state (duplicate name; last/non-empty profile).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: conflict, message: "A category with that name already exists" } }
    ValidationError:
      description: Input failed validation. `details` maps field → message.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: validation_error
              message: "Amount must be greater than 0"
              details: { amount: "Amount must be greater than 0" }
    RateLimited:
      description: The caller spent the shared per-user AI quota (30 calls/hour).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: rate_limited, message: "That's a lot of AI requests in the last hour — try again later" } }
    AiUnavailable:
      description: This AI feature's model isn't configured on the server (feature is off).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: ai_unavailable, message: "AI-assisted input isn't available right now." } }
    AiFailed:
      description: The upstream model provider failed; retrying may succeed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: ai_failed, message: "Couldn't reach the AI just now — please try again." } }
    StorageUnavailable:
      description: File storage (R2) isn't configured on the server.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: storage_unavailable, message: "File storage isn't configured on this server." } }
    PayloadTooLarge:
      description: >
        The upload doesn't fit: either a single file exceeds the per-file cap
        (5 MB — `payload_too_large`), or the batch would push the workspace
        past its 1 GB storage quota (`storage_quota_exceeded`, message says
        how much space remains and is safe to display as-is).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            payload_too_large:
              value: { error: { code: payload_too_large, message: "Each file must be 5 MB or smaller." } }
            storage_quota_exceeded:
              value: { error: { code: storage_quota_exceeded, message: "Not enough storage left — this upload needs 3.2 MB but only 1.1 MB of the 1.0 GB quota remains" } }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum: [unauthorized, forbidden, bad_request, not_found, conflict,
                     validation_error, rate_limited, payload_too_large,
                     storage_quota_exceeded, ai_unavailable, ai_failed,
                     storage_unavailable, internal_error]
            message: { type: string }
            details:
              description: Optional per-field messages for validation errors.
              type: object
              additionalProperties: { type: string }
          required: [code, message]
      required: [error]

    VersionInfo:
      type: object
      description: >
        Deliberately limited to public, non-sensitive facts (the source is AGPL
        and on GitHub): no dependency versions, hostnames, regions, env var
        names, or database/storage state.
      properties:
        name:
          type: string
          description: Product name.
          example: SpendChat
        version:
          type: string
          description: >
            The deployed **server/web** release (package.json + CHANGELOG.md) —
            not the mobile app's own version.
          example: "0.1.0"
        apiVersion:
          type: string
          description: Version of this `/api/v1` contract (= `info.version`).
          example: "5.6.0"
        environment:
          type: string
          enum: [production, beta, development]
          description: Which deployment answered. Anything unrecognized reads as "development".
        build:
          description: >
            Identity of the deployed Cloudflare Worker version. **Nullable** —
            null on a local run and on any deploy that predates the
            version-metadata binding, so treat it as optional.
          oneOf:
            - type: "null"
            - type: object
              properties:
                id:
                  type: string
                  description: Worker version id — quote it in a bug report.
                  example: c9a1f0d2-1b4e-4a77-9d2e-0c3b6f5a8e11
                deployedAt:
                  type: [string, "null"]
                  format: date-time
                  description: When that version was uploaded; null if the runtime gave no parseable timestamp.
              required: [id, deployedAt]
        changelog:
          type: object
          description: Where to read what changed (deep-link these from an about screen).
          properties:
            app:
              type: string
              format: uri
              description: CHANGELOG.md for the `version` field.
            api:
              type: string
              format: uri
              description: The `/api/v1` changelog for the `apiVersion` field.
          required: [app, api]
      required: [name, version, apiVersion, environment, build, changelog]

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: [string, "null"] }
        name: { type: [string, "null"] }
      required: [id, email, name]

    WorkspaceSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        icon:
          type: [string, "null"]
          description: Emoji shown beside the workspace name; null when unset.
          example: "🏢"
        role:
          description: Effective role in this workspace; null when access is via a per-profile grant only.
          oneOf:
            - type: "null"
            - type: string
              enum: [viewer, editor, admin]
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        locale: { type: string, example: en-US }
        currencyDetail: { $ref: "#/components/schemas/CurrencyMeta" }
      required: [id, name, icon, role, currency, locale, currencyDetail]

    WorkspaceInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 30
          description: Workspace name (trimmed server-side).
        icon:
          type: string
          maxLength: 16
          description: Optional emoji for the workspace. Omitted/empty seeds the default (🏢).
          example: "🏢"
      required: [name]

    CurrencyMeta:
      type: object
      description: Enough to format minor-unit amounts client-side.
      properties:
        code: { type: string, example: USD }
        symbol: { type: string, example: "$" }
        decimals: { type: integer, example: 2 }
      required: [code, symbol, decimals]

    Settings:
      type: object
      description: >
        User settings that follow the user across every workspace. Currency and
        number format are per-workspace (see WorkspaceSummary), not here.
      properties:
        theme: { type: string, enum: [light, dark, system] }
        inputMode: { type: string, enum: [amount_title, title_amount, combined] }
        voiceLanguages:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: "#/components/schemas/VoiceLanguageCode" }
          description: >
            Languages voice entry tells the transcription model to expect (a
            list, so code-mixed speech works). Normalized server-side; never
            empty (default ["en"]).
      required: [theme, inputMode, voiceLanguages]

    SettingsPatch:
      type: object
      minProperties: 1
      description: Any subset; at least one property required.
      properties:
        theme: { type: string, enum: [light, dark, system] }
        inputMode: { type: string, enum: [amount_title, title_amount, combined] }
        voiceLanguages:
          type: array
          maxItems: 20
          items: { type: string, minLength: 2, maxLength: 8 }
          description: >
            ISO 639-1 codes from the supported catalogue (see
            VoiceLanguageCode). Normalized server-side rather than rejected:
            unknown codes are dropped, duplicates removed, the list capped at
            5, and an empty/all-unknown list falls back to the default ["en"].
            The response carries the normalized result.

    WorkspaceCurrencyPatch:
      type: object
      description: Update a workspace's currency + number format (admin only).
      properties:
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        locale: { type: string, minLength: 2, maxLength: 20 }
      required: [currency, locale]

    CurrencyCode:
      type: string
      description: One of the 59 supported ISO 4217 codes.
      enum: [USD, EUR, GBP, INR, JPY, CAD, AUD, SGD, AED, CHF, CNY, BRL, ZAR, NGN,
             HKD, NZD, SEK, NOK, DKK, ISK, PLN, CZK, HUF, RON, BGN, TRY, RUB, UAH,
             ILS, SAR, QAR, KWD, BHD, OMR, JOD, EGP, KES, GHS, MAD, TZS, UGX, ETB,
             PKR, BDT, LKR, NPR, THB, VND, IDR, MYR, PHP, KRW, TWD, MXN, ARS, CLP,
             COP, PEN, UYU]

    Transaction:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [income, expense] }
        amountMinor:
          type: integer
          description: Positive amount in the user's currency minor units (source of truth).
          example: 1250
        amount:
          type: string
          description: Same value in major units, formatted to the currency's decimals.
          example: "12.50"
        title: { type: [string, "null"] }
        description: { type: [string, "null"] }
        occurredOn: { type: string, format: date, example: "2026-06-01" }
        createdAt: { type: string, format: date-time }
        category:
          oneOf:
            - type: "null"
            - type: object
              properties:
                id: { type: string, format: uuid }
                name: { type: [string, "null"] }
                icon: { type: [string, "null"] }
              required: [id, name, icon]
        profile:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: [string, "null"] }
            icon: { type: [string, "null"] }
          required: [id, name, icon]
        user:
          type: object
          description: >
            Author attribution — who entered the row. Matters in shared
            workspaces (show it WhatsApp-group style when the workspace has
            more than one user; hide it in a solo workspace).
          properties:
            id: { type: string, format: uuid }
            name: { type: [string, "null"] }
            email: { type: [string, "null"] }
          required: [id, name, email]
        attachments:
          type: array
          description: >
            Files attached to the transaction, oldest first. Empty array when
            none; `attachments.length` drives the 📎 indicator. Fetch bytes via
            GET /attachments/{id}/url.
          items: { $ref: "#/components/schemas/Attachment" }
      required: [id, type, amountMinor, amount, title, description, occurredOn,
                 createdAt, category, profile, user, attachments]

    TransactionInput:
      type: object
      properties:
        type: { type: string, enum: [income, expense] }
        amount:
          type: number
          description: Positive major-unit amount (e.g. 12.50). Numeric strings are coerced. Converted to minor units server-side. Whole-number part capped at 9 digits.
          exclusiveMinimum: 0
          maximum: 999999999.99
        categoryId:
          type: [string, "null"]
          format: uuid
          description: Must belong to the caller; an unknown id is stored as null.
        profileId:
          type: [string, "null"]
          format: uuid
          description: Must be writable by the caller; an unknown/absent id uses the default (first writable) profile.
        title: { type: string, maxLength: 40 }
        description: { type: string, maxLength: 150 }
        note:
          type: string
          maxLength: 40
          deprecated: true
          description: Deprecated alias for `title`. Use `title`.
        occurredOn: { type: string, format: date, example: "2026-06-01" }
      required: [type, amount, occurredOn]

    Category:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [income, expense] }
        icon: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, name, kind, icon, createdAt, updatedAt]

    CategoryInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 20 }
        kind: { type: string, enum: [income, expense] }
        icon: { type: string, maxLength: 16 }
      required: [name, kind]

    CategoryUpdate:
      type: object
      description: Any subset of the mutable fields.
      properties:
        name: { type: string, minLength: 1, maxLength: 20 }
        icon: { type: [string, "null"], maxLength: 16 }

    Profile:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        icon: { type: [string, "null"] }
        color: { type: [string, "null"], description: Exists in the schema but no UI sets it. }
        sortOrder: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, name, icon, color, sortOrder, createdAt, updatedAt]

    ProfileInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 20 }
        icon: { type: string, maxLength: 16 }
        color: { type: string, maxLength: 32 }
      required: [name]

    ProfileUpdate:
      type: object
      description: Any subset of the mutable fields.
      properties:
        name: { type: string, minLength: 1, maxLength: 20 }
        icon: { type: [string, "null"], maxLength: 16 }
        color: { type: [string, "null"], maxLength: 32 }

    ProfileDeletionImpact:
      type: object
      description: >
        What a profile delete would take with it, for the confirm step. All
        three counts follow the caller's disposal: destroyed on
        `transactions=delete`, re-filed on `transactions=move`.
      properties:
        transactions:
          type: integer
          description: Transactions filed under the profile — deletable or movable.
        files:
          type: integer
          description: >
            Vault files stored under the profile. Deleted with it, or moved
            with it — the vault follows the same choice as the transactions.
        attachments:
          type: integer
          description: >
            Receipts attached to those transactions. Counted separately from
            `files` because they are a different thing to the user. A profile
            can hold no vault files and dozens of receipts, or no transactions
            and a full vault, so a dialog that reads only one of the three
            under-reports what it is about to act on.
      required: [transactions, files, attachments]

    Summary:
      type: object
      description: All values are minor units.
      properties:
        income: { type: integer }
        expense: { type: integer }
        balance: { type: integer, description: income - expense }
      required: [income, expense, balance]

    CategoryBreakdownItem:
      type: object
      properties:
        categoryId: { type: [string, "null"], format: uuid }
        categoryName: { type: [string, "null"] }
        categoryIcon: { type: [string, "null"] }
        total: { type: integer, description: Minor units. }
      required: [categoryId, categoryName, categoryIcon, total]

    MonthlyPoint:
      type: object
      properties:
        month: { type: string, example: "2026-06", description: "YYYY-MM" }
        income: { type: integer, description: Minor units. }
        expense: { type: integer, description: Minor units. }
      required: [month, income, expense]

    DeletedResult:
      type: object
      properties:
        id: { type: string, format: uuid }
        deleted: { type: boolean, enum: [true] }
      required: [id, deleted]

    Attachment:
      type: object
      description: Attachment metadata. The bytes live in object storage — fetch via GET /attachments/{id}/url.
      properties:
        id: { type: string, format: uuid }
        transactionId: { type: string, format: uuid }
        fileName: { type: string, maxLength: 200, description: Sanitized original filename. }
        contentType:
          type: string
          description: Canonical MIME type (from the upload allowlist).
          enum: [image/jpeg, image/png, image/webp, image/gif, application/pdf,
                 application/msword,
                 application/vnd.openxmlformats-officedocument.wordprocessingml.document,
                 application/vnd.ms-excel,
                 application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,
                 text/csv, text/plain]
        sizeBytes: { type: integer, maximum: 5242880 }
        kind:
          description: Optional preset tag.
          oneOf:
            - type: "null"
            - type: string
              enum: [receipt, bill, invoice, other]
        label:
          type: [string, "null"]
          maxLength: 80
          description: Optional custom display name; fall back to fileName when null.
        hasThumbnail:
          type: boolean
          description: True when a small preview object exists (image uploads that sent one) — fetch it with ?variant=thumb.
        createdAt: { type: string, format: date-time }
      required: [id, transactionId, fileName, contentType, sizeBytes, kind, label, hasThumbnail, createdAt]

    AttachmentMetaPatch:
      type: object
      minProperties: 1
      description: Any subset; `null` clears a field.
      properties:
        label: { type: [string, "null"], maxLength: 80 }
        kind:
          oneOf:
            - type: "null"
            - type: string
              enum: [receipt, bill, invoice, other]

    AttachmentUrl:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: Presigned URL — GET it without the Authorization header.
        expiresInSeconds: { type: integer, example: 300 }
        fileName: { type: string }
        contentType: { type: string, description: image/webp when serving the thumb variant. }
      required: [url, expiresInSeconds, fileName, contentType]

    FileCategory:
      type: string
      description: Preset document categories for vault files.
      enum: [board-resolution, company, personal, land, house, certificate, other]

    VaultColor:
      type: string
      description: A hex accent color, `#rrggbb`. The web UI offers a fixed 20-swatch palette, but any hex is valid.
      pattern: "^#[0-9a-fA-F]{6}$"
      example: "#3b82f6"

    Folder:
      type: object
      description: >
        A vault folder. `system: true` marks the predefined per-profile
        "Transaction attachments" folder — recolor/tag only; never rename,
        move, delete, share, upload into, or nest under it.
      properties:
        id: { type: string, format: uuid }
        profileId: { type: string, format: uuid }
        parentId:
          type: [string, "null"]
          format: uuid
          description: null = a root folder.
        name: { type: string, maxLength: 40 }
        color:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/VaultColor"
          description: Accent hex, or null for the neutral default.
        tagIds:
          type: array
          items: { type: string, format: uuid }
          description: Applied tags (resolve against the tags list).
        system: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        createdByName:
          type: [string, "null"]
          description: Creator attribution (display only).
      required: [id, profileId, parentId, name, color, tagIds, system,
                 createdAt, updatedAt, createdByName]

    VaultFile:
      type: object
      description: >
        A vault file's metadata. The bytes live in object storage — fetch via
        GET /files/{id}/url. Unlike attachments there is no contentType
        allowlist; an unknown type is application/octet-stream.
      properties:
        id: { type: string, format: uuid }
        profileId: { type: string, format: uuid }
        folderId:
          type: [string, "null"]
          format: uuid
          description: null = the profile's root.
        name: { type: string, maxLength: 200, description: Sanitized display/file name. }
        contentType:
          type: string
          description: >-
            Resolved from the filename extension when the stored type is
            missing or application/octet-stream, so this is the file's real
            type even for files uploaded before that resolution existed.
        sizeBytes: { type: integer, maximum: 5242880 }
        category:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/FileCategory"
        tagIds:
          type: array
          items: { type: string, format: uuid }
        hasThumbnail:
          type: boolean
          description: True when a small preview object exists — fetch it with ?variant=thumb.
        createdAt: { type: string, format: date-time }
        uploaderName: { type: [string, "null"], description: Uploader attribution (display only). }
        profileName: { type: [string, "null"] }
        profileIcon: { type: [string, "null"] }
      required: [id, profileId, folderId, name, contentType, sizeBytes,
                 category, tagIds, hasThumbnail, createdAt, uploaderName,
                 profileName, profileIcon]

    TransactionFile:
      type: object
      description: >
        A transaction attachment as the vault surfaces it — the same attachment
        as Transaction.attachments, flattened with the transaction info needed
        to recognize it. `id` is the ATTACHMENT id: fetch bytes via
        GET /attachments/{id}/url. These render "inside" the predefined
        "Transaction attachments" folder and carry no tags.
      properties:
        id: { type: string, format: uuid }
        transactionId: { type: string, format: uuid }
        name: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer }
        hasThumbnail: { type: boolean }
        createdAt: { type: string, format: date-time }
        txnTitle: { type: [string, "null"] }
        txnType: { type: string, enum: [income, expense] }
        txnAmountMinor: { type: integer, description: Positive minor units; sign from txnType. }
        txnOccurredOn: { type: string, format: date }
        profileId: { type: string, format: uuid }
        profileName: { type: [string, "null"] }
        profileIcon: { type: [string, "null"] }
      required: [id, transactionId, name, contentType, sizeBytes, hasThumbnail,
                 createdAt, txnTitle, txnType, txnAmountMinor, txnOccurredOn,
                 profileId, profileName, profileIcon]

    FileTag:
      type: object
      description: A per-profile tag entity. Files/folders reference it via tagIds.
      properties:
        id: { type: string, format: uuid }
        profileId: { type: string, format: uuid }
        name: { type: string, maxLength: 20 }
        color: { $ref: "#/components/schemas/VaultColor" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, profileId, name, color, createdAt, updatedAt]

    FileShare:
      type: object
      description: >
        A public share link. The token IS the capability — treat it like a
        secret. The shareable web page is `<web-origin><sharePath>`.
      properties:
        id: { type: string, format: uuid }
        fileId: { type: [string, "null"], format: uuid }
        folderId: { type: [string, "null"], format: uuid }
        token: { type: string, maxLength: 64 }
        sharePath: { type: string, example: "/share/aBcD…" }
        allowDownload:
          type: boolean
          description: >-
            false = view-only link: recipients get inline previews of what the
            browser renders, and a 403 for anything else (no download UI, and
            no URL that would save the file instead).
        expiresAt:
          type: [string, "null"]
          format: date-time
          description: null = the link never expires.
        createdAt: { type: string, format: date-time }
      required: [id, fileId, folderId, token, sharePath, allowDownload,
                 expiresAt, createdAt]

    FolderInput:
      type: object
      properties:
        profileId: { type: string, format: uuid }
        parentId: { type: [string, "null"], format: uuid }
        name: { type: string, minLength: 1, maxLength: 40 }
        color:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/VaultColor"
        tagIds:
          type: array
          maxItems: 10
          items: { type: string, format: uuid }
      required: [profileId, name]

    FolderPatch:
      type: object
      minProperties: 1
      description: "Any subset. `parentId: null` moves to the root; `color: null` clears the accent."
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        color:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/VaultColor"
        tagIds:
          type: array
          maxItems: 10
          items: { type: string, format: uuid }
        parentId: { type: [string, "null"], format: uuid }

    VaultFilePatch:
      type: object
      minProperties: 1
      description: "Any subset. `folderId: null` moves the file to the root; `category: null` clears it."
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        category:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/FileCategory"
        tagIds:
          type: array
          maxItems: 10
          items: { type: string, format: uuid }
        folderId: { type: [string, "null"], format: uuid }

    FileTagInput:
      type: object
      properties:
        profileId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 20 }
        color: { $ref: "#/components/schemas/VaultColor" }
      required: [profileId, name, color]

    FileTagPatch:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 20 }
        color: { $ref: "#/components/schemas/VaultColor" }

    FileShareInput:
      type: object
      description: Exactly one of fileId / folderId.
      properties:
        fileId: { type: string, format: uuid }
        folderId: { type: string, format: uuid }
        allowDownload: { type: boolean, default: true }
        expiresInDays:
          type: [integer, "null"]
          minimum: 1
          maximum: 365
          description: Omitted/null = the link never expires.

    AiParseInput:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
          description: The free-text note to parse (trimmed server-side).
        timezone:
          type: string
          description: IANA zone (e.g. Asia/Kolkata) anchoring "today" for relative dates. Send the device zone; omitted → UTC.
          example: Asia/Kolkata
      required: [text]

    AiDraft:
      type: object
      description: >
        One parsed transaction, for user review. Maps 1:1 onto a
        TransactionInput for POST /transactions/bulk (drop categoryName; add
        profileId if the user picked a profile).
      properties:
        type: { type: string, enum: [income, expense] }
        amount:
          type: number
          description: Positive major-unit amount, within TransactionInput's limits.
          exclusiveMinimum: 0
          maximum: 999999999.99
        title:
          type: string
          maxLength: 40
          description: >
            Sentence-cased by the server ("banana" comes back "Banana"), so
            drafts read like hand-typed rows. Only the first character is
            touched — "iPhone case" and "AC repair" survive as typed.
        description:
          type: [string, "null"]
          maxLength: 150
          description: Sentence-cased the same way as title.
        categoryId:
          type: [string, "null"]
          format: uuid
          description: Resolved id of the matched workspace category (of the draft's type), or null when nothing fits.
        categoryName:
          type: [string, "null"]
          description: The matched category's exact stored name (display convenience; same match as categoryId).
        occurredOn:
          type: string
          format: date
          description: Defaults to "today" in the supplied timezone; never a future date.
      required: [type, amount, title, description, categoryId, categoryName, occurredOn]

    VoiceLanguageCode:
      type: string
      description: >
        ISO 639-1 codes voice entry supports (the settings picker's catalogue,
        ordered English first, then Indian languages, then the rest). en
        English, bn Bengali, gu Gujarati, hi Hindi, kn Kannada, ml Malayalam,
        mr Marathi, or Odia, pa Punjabi, ta Tamil, te Telugu, ur Urdu,
        ar Arabic, de German, es Spanish, fr French, id Indonesian, it Italian,
        ja Japanese, ko Korean, nl Dutch, pt Portuguese, ru Russian, th Thai,
        tr Turkish, vi Vietnamese, zh Chinese.
      enum: [en, bn, gu, hi, kn, ml, mr, or, pa, ta, te, ur, ar, de, es, fr,
             id, it, ja, ko, nl, pt, ru, th, tr, vi, zh]
