  /api/v1/attachments/{id}/url:
    parameters:
      - $ref: "#/components/parameters/id"
      - $ref: "#/components/parameters/workspaceHeader"
    get:
      tags: [Attachments]
      summary: Mint a short-lived download URL for an attachment's bytes
      description: |
        Authorizes the caller (viewer-or-better on the attachment's profile in
        the current workspace), then returns a **presigned URL** valid for
        ~5 minutes. GET that URL directly **without** the Authorization header —
        the signature in the URL is the credential. Mint per view; don't cache
        the URL beyond `expiresInSeconds`.

        `?variant=thumb` returns the small preview object when one exists
        (`hasThumbnail: true`; falls back to the original otherwise, and the
        returned `contentType` is then `image/webp`). `?download=1` sets an
        attachment disposition so a browser/share-sheet saves instead of
        displaying.
      parameters:
        - name: variant
          in: query
          required: false
          schema: { type: string, enum: [thumb] }
        - name: download
          in: query
          required: false
          schema: { type: string, enum: ["1"] }
      responses:
