  /api/v1/tags:
    get:
      tags: [Tags]
      summary: List transaction tags (by name, case-insensitively)
      description: |
        The current workspace's shared tag list (scoped by `X-Workspace-Id`).
        Every member sees the same tags, and a transaction references them by
        id — so a rename here changes every transaction carrying the tag.

        A new workspace is seeded with two tags, "Recurring" and
        "Reimbursable" (6.5.0; it started empty before). They count toward the
        plan's tag cap.

        These are transaction tags. The vault's per-profile file tags are a
        different entity with its own endpoints (`/api/v1/file-tags`).
      parameters:
        - $ref: "#/components/parameters/workspaceHeader"
      responses:
        "200":
          description: The current workspace's tags.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Tag" }
                required: [data]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Tags]
      summary: Create a tag
      description: |
        Creates a tag in the current workspace (`X-Workspace-Id`). Requires the
        **editor** role or higher — a viewer gets 403.

        Names are unique per workspace, case-insensitively: creating "travel"
        where "Travel" exists is a 409. `color` is stored lowercased.

        The workspace's plan caps its tags (5 / 10 / 20 on Free / Plus / Pro):
        at the cap this is `403 plan_limit` with `limit: "tags"`. Independently
        of the plan there is a hard ceiling of 100 tags (409 past that) — only
        reachable by a workspace that already had more than its plan allows.
      parameters:
        - $ref: "#/components/parameters/workspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TagInput" }
      responses:
        "201":
          description: The created tag.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/Tag" } }
                required: [data]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOrPlanLimit" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/tags/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
      - $ref: "#/components/parameters/workspaceHeader"
    patch:
      tags: [Tags]
      summary: Rename or recolor a tag (partial)
      description: |
        Requires the **editor** role or higher. The change is visible on every
        transaction carrying the tag, since transactions reference it by id and
        resolve it at read time.

        A body that changes nothing is a 422, not a silent no-op.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TagUpdate" }
      responses:
        "200":
          description: The updated tag.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/Tag" } }
                required: [data]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Tags]
      summary: Delete a tag (and detach it from every transaction)
      description: |
        Requires the **editor** role or higher. The tag row and its id in every
        `transaction.tagIds` in the workspace go in one database transaction —
        the transactions themselves are untouched apart from losing the tag.
      responses:
        "200":
          description: Deletion acknowledged.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/DeletedResult" } }
                required: [data]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/profiles:
    get:
      tags: [Profiles]
      summary: List profiles (sidebar order)
      parameters:
        - $ref: "#/components/parameters/workspaceHeader"
      responses:
        "200":
          description: The caller's accessible profiles in this workspace.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Profile" }
                required: [data]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Profiles]
      summary: Create a profile (admin only)
      description: |
        Creates a profile at the end of the sidebar order, in `spaceId` when
        given (a space of the current workspace — 404 otherwise) or else the
        workspace's first space. Requires the workspace **admin** role.

        The plan caps profiles per space (3 / 5 / 10 on Free / Plus / Pro): a
        full space is `403 plan_limit` with `limit: "profilesPerSpace"`.
      parameters:
        - $ref: "#/components/parameters/workspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "201":
          description: The created profile.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/Profile" } }
                required: [data]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOrPlanLimit" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/profiles/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    patch:
      tags: [Profiles]
      summary: Update a profile (partial, admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpdate" }
      responses:
        "200":
          description: The updated profile.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/Profile" } }
                required: [data]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Profiles]
      summary: Delete a profile (admin only)
      description: >
        `transactions` decides what happens to the transactions filed under the
        profile: `delete` removes them (and their attachments) with it, `move`
        re-files them under `to` first, and `reject` — the default, so a client
        that sends nothing behaves exactly as before — refuses with 409 while
        any remain ("Move this profile's transactions to another profile
        first"). 409 for the last remaining profile ("You need at least one
        profile") whatever the mode.


        The profile's **vault** (files, folders, tags and share links)
        follows the same choice: `move` re-files it under `to`, `delete`
        destroys it. Two collisions resolve automatically — a file-tag whose
        name already exists in the destination is merged into it, so the moved
        tag's id disappears, and the source's predefined "Transaction
        attachments" folder is dropped once its contents are re-parented into
        the destination's.
        Call /profiles/{id}/deletion-impact first to show the counts.
      parameters:
        - name: transactions
          in: query
          required: false
          description: What to do with the profile's transactions.
          schema:
            type: string
            enum: [reject, delete, move]
            default: reject
        - name: to
          in: query
          required: false
          description: >
            Destination profile id. Required when `transactions=move` (422
            otherwise); must be another profile in the same workspace that the
            caller can edit.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Deletion acknowledged.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/DeletedResult" } }
                required: [data]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/profiles/reorder:
    post:
      tags: [Profiles]
      summary: Reorder profiles (admin only)
      parameters:
        - $ref: "#/components/parameters/workspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  description: The full ordered list of this workspace's profile ids.
                  items: { type: string, format: uuid }
                  minItems: 1
                  maxItems: 100
              required: [ids]
      responses:
        "200":
          description: The profiles in their new order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Profile" }
                required: [data]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/profiles/{id}/deletion-impact:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags: [Profiles]
      summary: What deleting this profile would take with it (admin only)
      description: >
        Counts for the delete confirmation. `transactions` is the number whose
        fate the caller chooses (`?transactions=` on DELETE); `attachments` are
        the receipts on those transactions and `files` the profile's vault. All
        three follow the disposal — destroyed on `delete`, moved on `move` — so
        offer the choice whenever `transactions` or `files` is above zero.
      responses:
        "200":
          description: The counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ProfileDeletionImpact" }
                required: [data]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/profiles/{id}/move:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      tags: [Profiles]
      summary: Move this profile's transactions to another profile (editor only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                toProfileId: { type: string, format: uuid }
              required: [toProfileId]
      responses:
        "200":
          description: How many transactions were moved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties: { moved: { type: integer } }
                    required: [moved]
                required: [data]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/profiles/{id}/space:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      tags: [Profiles]
      summary: Move a profile into another space (admin only)
      description: |
        Moves the profile into another space of **its** workspace (the path id
        decides the workspace, like the other profile item endpoints).
        Requires the workspace **admin** role. Who can see the profile follows
        the new space's members, plus anyone with an override on the profile
        itself (overrides belong to the profile and move with it). Moving it
        into the space it's already in is a no-op.

        A full destination space is `403 plan_limit` with
        `limit: "profilesPerSpace"`. 422 for a malformed profile id or
        `spaceId`; 404 when the space isn't in the profile's workspace.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileSpaceMove" }
      responses:
        "200":
          description: The profile, with its new `spaceId`.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/Profile" } }
                required: [data]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOrPlanLimit" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/profiles/{id}/overrides:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags: [Profiles]
      summary: Per-profile access overrides on one profile (admin only)
      description: |
        The overrides on this profile, oldest first. An override replaces a
        member's space role on this one profile: `none` hides it inside their
        space, `read` / `write` open it (read-only / editable) even in a space
        they're not in. Only non-admin workspace members are listed — admins
        see everything, so an override means nothing for them. Requires the
        workspace **admin** role. 422 for a malformed id.
      responses:
        "200":
          description: The profile's overrides.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ProfileOverride" }
                required: [data]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    put:
      tags: [Profiles]
      summary: Set or clear one member's override on this profile (admin, Plus/Pro)
      description: |
        Sets `userId`'s override on this profile to `none` / `read` / `write`,
        or clears it with `access: null` (back to their space role). Requires
        the workspace **admin** role; the target must be a non-admin member of
        the workspace (400 "Add them to the workspace first" / "Admins already
        see every space").

        Changing overrides is a **Plus/Pro** feature: on Free this is
        `403 plan_limit` with `limit: "profileLevelAccess"`. Existing
        overrides keep applying after a downgrade, so a downgrade never widens
        anyone's access — and on Free an override that already exists can
        still be *narrowed* (set to `none`, or cleared when that doesn't open
        anything up); creating or widening one is what's refused.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileOverrideInput" }
      responses:
        "200":
          description: The profile's overrides after the change.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ProfileOverride" }
                required: [data]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOrPlanLimit" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/spaces:
    get:
      tags: [Spaces]
      summary: List the current workspace's spaces
      description: |
        The spaces of the current workspace (`X-Workspace-Id`) the caller can
        see, ordered by `position`. Workspace admins see every space (`role:
        "admin"`); anyone else sees the spaces they're a member of (at their
        space role) plus any space holding a profile they reach another way —
        an override or a per-profile grant — with `role: null`.
      parameters:
        - $ref: "#/components/parameters/workspaceHeader"
      responses:
        "200":
          description: The visible spaces, in order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Space" }
                required: [data]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Spaces]
      summary: Create a space (admin only)
      description: |
        Creates a space at the end of the current workspace's list. Requires
        the workspace **admin** role. Names are unique per workspace (409).
        The plan caps spaces (2 / 6 / 15 on Free / Plus / Pro, the default
        space included): at the cap this is `403 plan_limit` with
        `limit: "spaces"`.
      parameters:
        - $ref: "#/components/parameters/workspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SpaceInput" }
      responses:
        "201":
          description: 'The created space (`role` is `admin`, `profileCount` is 0).'
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/Space" } }
                required: [data]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOrPlanLimit" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/spaces/reorder:
    post:
      tags: [Spaces]
      summary: Reorder spaces (admin only)
      description: |
        Persists the order of the current workspace's spaces. Send the full
        ordered list; every id must be a space of this workspace (400
        otherwise) and none may repeat (422). Requires the workspace **admin**
        role.
      parameters:
        - $ref: "#/components/parameters/workspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SpaceReorder" }
      responses:
        "200":
          description: The spaces in their new order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Space" }
                required: [data]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/spaces/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
      - $ref: "#/components/parameters/workspaceHeader"
    patch:
      tags: [Spaces]
      summary: Rename / re-icon a space (admin only)
      description: |
        Scoped to the current workspace: a space id from another workspace is
        a 404 (a malformed id is a 422). Requires the workspace **admin** role.
        At least one of `name` / `icon`; `icon: ""` or `null` clears it.
        409 for a duplicate name.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SpaceUpdate" }
      responses:
        "200":
          description: The updated space.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/Space" } }
                required: [data]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Spaces]
      summary: Delete a space (admin only)
      description: |
        Scoped to the current workspace (404 for a space elsewhere, 422 for a
        malformed id). Requires the workspace **admin** role.

        **Profiles are never deleted with a space.** An empty space just goes.
        One that still holds profiles needs a destination — `moveProfilesTo`,
        another space of the same workspace — or the delete is refused with
        409 ("This space still has profiles — move them to another space
        first"); the move and the delete commit together. The destination must
        have room under the plan's per-space cap (`403 plan_limit`,
        `limit: "profilesPerSpace"`). The workspace's **last** space can't be
        deleted (409). Membership rows go with the space.

        Send the destination either as the `moveProfilesTo` query parameter or
        as an optional JSON body `{ "moveProfilesTo": "<uuid>" }`; when both
        are sent the body wins. A blank `?moveProfilesTo=` counts as absent.
      parameters:
        - name: moveProfilesTo
          in: query
          required: false
          description: The space to move this space's profiles into.
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SpaceDeleteInput" }
      responses:
        "200":
          description: Deletion acknowledged.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/DeletedResult" } }
                required: [data]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOrPlanLimit" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/spaces/{id}/access:
    parameters:
      - $ref: "#/components/parameters/id"
      - $ref: "#/components/parameters/workspaceHeader"
    get:
      tags: [Spaces]
      summary: Members & access for one space (admin only)
      description: |
        Everything a "Members & access" screen shows for one space: every
        workspace member with their role in this space, the space's profiles,
        the per-profile overrides on them, and whether the plan lets
        overrides be changed (`canEditOverrides` — Plus/Pro). Scoped to the
        current workspace (404 elsewhere, 422 malformed id). Requires the
        workspace **admin** role.
      responses:
        "200":
          description: The space's access view.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/SpaceAccess" } }
                required: [data]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/spaces/{id}/members:
    parameters:
      - $ref: "#/components/parameters/id"
      - $ref: "#/components/parameters/workspaceHeader"
    put:
      tags: [Spaces]
      summary: Add, re-role or remove a member in one space (admin only)
      description: |
        Puts a workspace member in this space at `role` (`viewer` / `editor`),
        changes their role, or takes them out (`role: null`). Taking someone
        out also clears their overrides on this space's profiles, so "removed
        from the space" means no access to it. Requires the workspace
        **admin** role; the target must be a non-admin member of the
        workspace (400 otherwise — admins already see every space). Scoped to
        the current workspace (404 elsewhere, 422 malformed id).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SpaceMemberInput" }
      responses:
        "200":
          description: The space's access view after the change.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/SpaceAccess" } }
                required: [data]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/organization:
    get:
      tags: [Organization]
      summary: The caller's organisation and its workspaces
      description: |
        The caller's personal organisation — every account has exactly one,
        created at first sign-in — with its owner and every workspace in it
        (the ones the caller owns), each with its plan, whether it's
        view-only, and whether the caller can open it. Not scoped to one workspace: `X-Workspace-Id` is ignored.
      responses:
        "200":
          description: The organisation.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/Organization" } }
                required: [data]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [Organization]
      summary: Rename the caller's organisation
      description: |
        Renames the caller's personal organisation (they own it by
        definition). `X-Workspace-Id` is ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationPatch" }
      responses:
        "200":
          description: The renamed organisation.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/Organization" } }
                required: [data]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/usage:
    get:
      tags: [Usage]
      summary: The current workspace's plan, limits and usage
      description: |
        Everything the current workspace's plan allows and how much of it is
        in use, in one call — for a plan/usage screen and for gating UI before
        the server has to refuse: AI actions this month, storage, members,
        spaces, categories and tags (each `{ used, limit }`), the per-space
        profile cap, and the feature flags (`voice`, `profileLevelAccess`).
        `readOnly: true` means the workspace is an extra free one (its owner
        has an older free workspace) — render it view-only. Readable by anyone
        who can open the workspace.
      parameters:
        - $ref: "#/components/parameters/workspaceHeader"
      responses:
        "200":
          description: The workspace's usage.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/Usage" } }
                required: [data]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/settings:
    get:
      tags: [Settings]
      summary: Get settings
      responses:
        "200":
          description: The caller's settings.
