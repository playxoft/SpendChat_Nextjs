        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Categories]
      summary: Create a category
      description: |
        Creates a category in the current workspace (`X-Workspace-Id`). Requires
        the **editor** role or higher — a viewer gets 403.

        The workspace's plan caps its categories (20 / 30 / 50 on Free / Plus /
        Pro; the 10 seeded defaults count, and deleting one frees a slot). At the
