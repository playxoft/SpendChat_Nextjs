openapi: 3.1.0
info:
  title: SpendChat Mobile API
  version: "6.5.0"
  description: |
    REST API for the SpendChat mobile (Flutter) client, versioned under `/api/v1`
    and served by the same Next.js app as the web UI.

    **Spec version** is `info.version` above — deliberately not repeated here,
    because a second copy is a second thing to forget (this line said 5.5.0 for
    four releases). See `_changelog.md` (this folder) for the per-version history
    of API changes: what the Flutter app needs to update.

    **Telemetry header.** Send `X-Client-Platform: android | ios` on every
    request so server logs attribute the platform. It's optional and never
    changes a response; omitting it just records the platform as `api`.

    This spec is the **corrected** contract for the Flutter port. It fixes the
    following from the original `_developer/api/openapi.yaml`:
      - adds the `X-Workspace-Id` request header (workspace scoping);
      - `GET /me` returns a `workspace` object;
      - `Error.code` includes `forbidden` (403);
      - `Category` has NO `color` field (DB/serializer/schemas don't have it);
      - `CurrencyCode` is the full 59-code list;
      - `TransactionInput` documents the deprecated `note` alias;
      - documents 403 on mutating endpoints.

    ## Authentication
    All `/api/v1/*` endpoints **except `GET /api/v1/version`** (public, so a
    client can check the contract version before it has a token) require a
    **Firebase ID token** as a bearer token:
    `Authorization: Bearer <idToken>`. The server verifies it (RS256) against
    Google's JWKS, pinning issuer + audience to the Firebase project. Tokens are
    short-lived (~1h); the Firebase SDK auto-refreshes. Email/password accounts
    must have a **verified email** (Google always does) — a token that carries
    an email without `email_verified: true` gets `403 forbidden`.

    Signing in with a *new* Firebase account whose **verified** email already
    belongs to an existing SpendChat account links the new provider to that
    account (same data). With an **unverified** email, any request returns
    `409 conflict` ("already registered with a different sign-in method").

    ## Workspaces
    Profiles live in workspaces. Select one with the `X-Workspace-Id` header
    (optional). If omitted, the server uses the user's `lastWorkspaceId`, else
    their first accessible workspace. An unknown id → `404 not_found`.

    List every workspace the user can open with `GET /workspaces` (for a
    workspace switcher). That endpoint ignores `X-Workspace-Id` and never 404s.
    Create one with `POST /workspaces` — the caller becomes its admin and the
    server makes the new workspace current (persists `lastWorkspaceId`).

    ## Conventions
    - **Envelope:** success = `{ "data": ... }` (plus `"meta"` for lists/
      analytics); error = `{ "error": { "code", "message", "details"? } }`.
    - **Statuses:** every workspace-scoped endpoint (all of them except
      `GET`/`POST /workspaces`) can return `403` (email not verified) and
      `404` (unknown/inaccessible `X-Workspace-Id`) — both are listed per
      path. Any endpoint that reads a JSON body can return `400` (malformed
      JSON). The account-linking `409` above can surface on any endpoint.
    - **Money** is integer minor units (`amountMinor`). Each transaction also
      returns `amount` (major-unit string). One currency **per workspace**;
      `meta.currency`/`workspace.currencyDetail` give the `decimals`.
    - **Dates:** `occurredOn` is a calendar date `YYYY-MM-DD`; timestamps are
      RFC 3339 date-times. All JSON responses set `Cache-Control: no-store`.

    ## AI endpoints
    `POST /ai/parse` (free text → reviewable transaction drafts) and
    `POST /ai/transcribe` (voice recording → note text) call a paid model
    provider, so they carry extra gates the CRUD endpoints don't:
    the **editor** role in the current workspace (403 otherwise), a shared
    per-user quota of **30 AI calls per hour** across both endpoints
    (`429 rate_limited`, checked first), the workspace's monthly **AI
    allowance** from its plan — 50 / 300 / 1,000 AI actions per UTC calendar
    month on Free / Plus / Pro (`403 plan_limit`, `limit: "aiActions"` once
    it's spent — see `GET /usage` → `ai`), voice entry for transcription
    (Pro only — otherwise `403 plan_limit`, `limit: "voice"`),
    `503 ai_unavailable` when the operator hasn't configured that feature's
    model, and `502 ai_failed` when the provider errors (a call that fails on
    our side gives its AI action back). A typed parse costs one AI action; a transcription costs one per
    started minute of the clip and also covers parsing its transcript (send
    that parse with `source: "voice"`). Neither endpoint writes anything: parse output is reviewed by the
    user and committed via `POST /transactions/bulk`; transcribe output is
    reviewed and then sent to `/ai/parse`. Audio is transcribed and discarded —
    never stored.

    ## Attachments
    Transactions can carry up to **2 attached files** (receipt/bill/invoice —
    images, PDF, Word, Excel, CSV or plain text, ≤ 5 MB each). Attachment
    metadata is embedded on every Transaction (`attachments`); bytes are
    uploaded multipart to `POST /transactions/{id}/attachments` and fetched via
    `GET /attachments/{id}/url`, which mints a short-lived presigned URL the
    client GETs **without** the Authorization header. Uploading/editing/deleting
    needs editor; viewing needs viewer. `503 storage_unavailable` when the
    server has no file storage configured; `413 payload_too_large` for an
    oversized file. Attachments count toward the workspace's **storage quota**
    (the plan's storage — 1 / 5 / 20 GB on Free / Plus / Pro — shared with the
    files vault); an upload that would exceed it gets
    `413 storage_quota_exceeded`.

    ## Files vault
    A Drive-like document store (board resolutions, land papers, certificates …)
    scoped per profile: nested **folders** (with a hex color accent), **files**
    (≤ 5 MB each, permissive types, optional preset category + thumbnail),
    per-profile **tags** (created entities referenced by id), and public
    **share links**. `GET /files` returns the whole working set in one call —
    folders, files, the transaction attachments surfaced in the vault, and
    tags; CRUD is per-resource under `/folders`, `/files`, `/file-tags`, and
    `/file-shares`. File bytes are fetched like attachments: mint a presigned
    URL with `GET /files/{id}/url` and GET it without the Authorization header.
    Every profile has a predefined **"Transaction attachments"** folder
    (`system: true`) mirroring that profile's transaction files — it can be
    recolored/tagged but never renamed, moved, deleted, shared, or uploaded
    into. Viewing needs viewer; every write needs editor. Same
    `503 storage_unavailable` / `413 payload_too_large` semantics as
    attachments.

    Each workspace has a **storage quota** — its plan's storage (1 / 5 / 20 GB
    on Free / Plus / Pro) — covering vault files and transaction attachments
    together. `GET /files` reports it in `meta.storage` (`usedBytes` /
    `limitBytes`, workspace-wide); an upload that would exceed it — on either
    upload endpoint — is rejected with `413 storage_quota_exceeded` (the
    message says how much space remains and is safe to display as-is;
    `details` carries the same plan fields as a `plan_limit` error, with
    `limit: "storage"`).

    ## Plans, spaces and the organisation (6.5.0)
    The hierarchy is **organisation → workspace → space → profile**. Every
    account has one personal organisation (`GET /organization`) holding the
    workspaces it owns. Each **workspace has a plan** — `free`, `plus` or
    `pro` (`WorkspaceSummary.plan`) — and every limit belongs to the
    workspace, shared by everyone in it: members, spaces, profiles per space,
    categories, tags, storage, AI actions per month, voice entry and
    per-profile access. `GET /usage` reports the current workspace's limits
    and how much of each is used.

    Profiles live in **spaces** (`Profile.spaceId`); the space is the unit of
    sharing. Workspace admins see every space; other members see the spaces
    they belong to (`GET /spaces`), at that space's role. A Plus/Pro
    workspace can also set a **per-profile override** that replaces the space
    role on one profile (`PUT /profiles/{id}/overrides`). Every profile
    response carries the caller's effective `access` (`read` / `write` /
    `admin`) — drive per-profile actions from it.

    **`403 plan_limit`.** When a plan doesn't allow an action the server
    answers `403` with `error.code = "plan_limit"` (distinct from `forbidden`,
    which is about role) and `details` = `PlanLimitDetails`
    (`{ limit, plan, max?, used?, upgradeTo }`). Show an upgrade prompt for
    `upgradeTo`, or "contact us" when it is `null`. The message is safe to
    display as-is. Limits apply to every workspace from the day plans ship,
    and they gate *adding*, never existing data: a workspace over a cap (after
    a downgrade) keeps everything and just can't add another.

    **View-only workspaces.** One free workspace per person: creating another
    is `403 plan_limit` (`freeWorkspaces`), and an extra free workspace (its
    owner has an older free one) is view-only —
    `GET /usage` → `readOnly: true`, every profile reads `access: "read"`, and
    writes are refused with `403 plan_limit`, `limit: "freeWorkspaces"` —
    anything inside a profile (transactions, attachments, vault files, profile
    edits) and every add at workspace level (profiles, spaces, categories,
    tags).

servers:
  - url: http://localhost:3010
    description: Local development (`pnpm dev`, port 3010)
  - url: https://beta.spendchat.app
    description: Beta (`pnpm deploy:dev`, --env beta)
  - url: https://spendchat.app
    description: Production (`pnpm deploy:prod`, --env production)

security:
  - bearerAuth: []

tags:
  - name: Meta
  - name: Account
  - name: Workspaces
  - name: Transactions
  - name: Attachments
  - name: Files
  - name: Categories
  - name: Tags
  - name: Profiles
  - name: Spaces
  - name: Organization
  - name: Usage
  - name: Settings
  - name: Analytics
  - name: AI

paths:
  /api/v1/version:
    get:
      tags: [Meta]
      summary: Deployed app + API version (no auth)
      description: |
        What is running: the app release, the version of **this** `/api/v1`
        contract, which deployment answered, and the deployed Worker build.

        **The one endpoint that needs no bearer token** — a client has to be
        able to read the contract version before it has one (and while showing
        an "update required" screen). It reads nothing per-user and touches no
        database.

        Also served at **`/version`** (outside `/api/v1`, byte-for-byte the same
        body) for `curl` and uptime checks.

        Suggested client use: compare `apiVersion`'s **major** with the version
        this app was built against — a higher major means the server contract
        moved on and the app should prompt an update. Show `version` + `build.id`
        on a debug/about screen so a bug report can name the exact deploy.

        Never cached (`Cache-Control: no-store`), so a poll always sees the
        current deploy.
      security: []
      responses:
        "200":
          description: The deployed version.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/VersionInfo" }
                required: [data]

  /api/v1/me:
    get:
      tags: [Account]
      summary: Current user, settings, and current workspace
      parameters:
        - $ref: "#/components/parameters/workspaceHeader"
      responses:
        "200":
          description: The authenticated user, their settings, and the current workspace.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user: { $ref: "#/components/schemas/User" }
                      settings: { $ref: "#/components/schemas/Settings" }
                      workspace: { $ref: "#/components/schemas/WorkspaceSummary" }
                    required: [user, settings, workspace]
                required: [data]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/workspaces:
    get:
      tags: [Workspaces]
      summary: List workspaces the user can open
      description: |
        Every workspace the authenticated user can access, for building a
        workspace switcher. Not scoped to one workspace — the `X-Workspace-Id`
        header is ignored and this never returns 404. Ordering: memberships
        first (workspace `createdAt` ascending), then grant-only workspaces.
        Always ≥ 1 entry for a bootstrapped user.
      responses:
        "200":
          description: The user's accessible workspaces.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WorkspaceSummary" }
                required: [data]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Workspaces]
      summary: Create a workspace
      description: |
        Creates a workspace; the caller becomes its **admin**. The server seeds
        an admin membership, a default "Personal" profile, the default
        category list (10) and tag list (2: "Recurring", "Reimbursable"), and
        makes the new workspace the caller's current one (persists `lastWorkspaceId`) —
        pin the returned id as `X-Workspace-Id` on subsequent requests. The
        `X-Workspace-Id` request header is ignored here (creation is not
        scoped to the current workspace).

        A new workspace starts on the **Free** plan, and a person gets one
        free workspace: when the caller already owns a free workspace this is
        `403 plan_limit` with `limit: "freeWorkspaces"` (`max: 1`,
        `upgradeTo: "plus"`) and nothing is created.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceInput" }
      responses:
        "201":
          description: The created workspace (`role` is always `admin`, `plan` is `free`).
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/WorkspaceSummary" } }
                required: [data]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOrPlanLimit" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/workspaces/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    patch:
      tags: [Workspaces]
      summary: Update a workspace's currency + number format
      description: |
        Sets the workspace's `currency` and `locale` (number format), which
        every member sees. **Admin only** — a non-admin gets 403. The
        `X-Workspace-Id` header is not used here; the workspace is the path `id`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceCurrencyPatch" }
      responses:
        "200":
          description: The updated workspace (with `currencyDetail`).
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/WorkspaceSummary" } }
                required: [data]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/transactions:
    get:
      tags: [Transactions]
      summary: List transactions (newest first)
      description: >
        Newest first, ordered by `occurredOn desc, createdAt desc, id desc`.
        The `id` tiebreaker makes the ordering total, so `limit`/`offset` paging
        cannot repeat or skip rows that tie on both timestamps — which
        bulk-created transactions routinely do, since a batch is written in one
        statement and so always shares `createdAt`.
      parameters:
        - $ref: "#/components/parameters/workspaceHeader"
        - $ref: "#/components/parameters/type"
        - $ref: "#/components/parameters/category"
        - $ref: "#/components/parameters/profile"
        - $ref: "#/components/parameters/from"
        - $ref: "#/components/parameters/to"
        - $ref: "#/components/parameters/q"
        - $ref: "#/components/parameters/tags"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: A page of transactions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Transaction" }
                  meta:
                    type: object
                    properties:
                      total: { type: integer, description: Total matching the filters (ignores paging). }
                      limit: { type: integer }
                      offset: { type: integer }
                      currency: { $ref: "#/components/schemas/CurrencyMeta" }
                    required: [total, limit, offset, currency]
                required: [data, meta]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Transactions]
      summary: Create a transaction
      parameters:
        - $ref: "#/components/parameters/workspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransactionInput" }
      responses:
        "201":
          description: The created transaction.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/Transaction" } }
                required: [data]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/transactions/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
      - $ref: "#/components/parameters/workspaceHeader"
    get:
      tags: [Transactions]
      summary: Get a transaction
      description: >
        Scoped to the current workspace: a transaction that lives in another of
        the caller's workspaces is a 404 (send the right `X-Workspace-Id`).
      responses:
        "200":
          description: The transaction.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/Transaction" } }
                required: [data]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Transactions]
      summary: Update a transaction (full replacement of mutable fields)
      description: >
        Send the complete transaction body, as the web editor does. Scoped to
        the current workspace — a transaction in another workspace is a 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransactionInput" }
      responses:
        "200":
          description: The updated transaction.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/Transaction" } }
                required: [data]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Transactions]
      summary: Delete a transaction
      description: >
        Scoped to the current workspace — a transaction in another workspace is
        a 404.
      responses:
        "200":
          description: Deletion acknowledged.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/DeletedResult" } }
                required: [data]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/transactions/bulk:
    post:
      tags: [Transactions]
      summary: Create many transactions (1–500)
      parameters:
        - $ref: "#/components/parameters/workspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: "#/components/schemas/TransactionInput" }
              required: [items]
      responses:
        "201":
          description: How many rows were inserted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties: { count: { type: integer } }
                    required: [count]
                required: [data]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/transactions/export:
    get:
      tags: [Transactions]
      summary: Export transactions as CSV
      description: >
        Returns text/csv (not the JSON envelope). Columns:
        Date,Type,Category,Note,Amount,Currency,Tags. Honours the same filters,
        no paging, up to 5000 rows. Amount is signed (expenses negative).

        `Tags` is the row's tag names joined by `"; "` (empty when it has
        none). It was appended in 6.2.0 rather than inserted, so every earlier
        column kept its position.

        Treat the cell as text to display, not a list to parse: a tag name is
        only trimmed and length-capped, so it may itself contain `;` or `,`.
        The file stays well-formed either way — a cell containing a comma is
        quoted, and the formula guard applies as it does to every text cell.

        Text cells that would otherwise be executed as a formula by
        Excel/Sheets (those starting with `=`, `+`, `-`, `@`, tab or CR) are
        prefixed with a single quote and quoted, e.g. a title `=SUM(A1)`
        exports as `"'=SUM(A1)"`. Numeric cells (including negative amounts
        like `-40.00`) are never prefixed, so the Amount column stays numeric.
      parameters:
        - $ref: "#/components/parameters/workspaceHeader"
        - $ref: "#/components/parameters/type"
        - $ref: "#/components/parameters/category"
        - $ref: "#/components/parameters/profile"
        - $ref: "#/components/parameters/from"
        - $ref: "#/components/parameters/to"
        - $ref: "#/components/parameters/q"
        - $ref: "#/components/parameters/tags"
      responses:
        "200":
          description: CSV file.
          content:
            text/csv:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/transactions/delete-all:
    post:
      tags: [Transactions]
      summary: Clear transactions in the current workspace, per profile (danger zone, admin only)
      description: >
        **Workspace admins only** (a non-admin caller gets 403). Permanently
        deletes **every** transaction (regardless of who authored it) in the
        selected profiles of the **current workspace**. `profileIds` omitted or
        empty clears every profile in the workspace; otherwise only the listed
        profiles are cleared (ids not in the current workspace are ignored).
        Categories and settings are kept.
      parameters:
        - $ref: "#/components/parameters/workspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm:
                  type: string
                  description: Must be the exact string "DELETE".
                  enum: ["DELETE"]
                profileIds:
                  type: array
                  description: >
                    Profiles to clear. Omit or send an empty array to clear every
                    profile in the current workspace.
                  items: { type: string, format: uuid }
              required: [confirm]
      responses:
        "200":
          description: How many transactions were removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties: { deleted: { type: integer } }
                    required: [deleted]
                required: [data]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/transactions/{id}/attachments:
    parameters:
      - $ref: "#/components/parameters/id"
      - $ref: "#/components/parameters/workspaceHeader"
    post:
      tags: [Attachments]
      summary: Attach files to a transaction (multipart, editor only)
      description: |
        Uploads one or more files (receipt / bill / invoice) to a transaction.
        Requires the **editor** role on the transaction's profile; the
        transaction must live in the current workspace (else 404).

        Multipart form data: files under `files` (repeatable; `file` also
        accepted). For an image file, a client-generated preview may ride along
        under `thumb_<index>` (webp recommended) — it becomes the tile
        thumbnail (`hasThumbnail`), so lists never pull full-size originals.

        Limits: at most **2 files per transaction** (total, including already
        attached ones — 400 when exceeded), **5 MB per file** (413
        `payload_too_large`), the workspace's **storage quota** — its plan's
        storage, 1 / 5 / 20 GB (413 `storage_quota_exceeded` when the batch
        doesn't fit), and only
        these types: JPEG, PNG, WebP, GIF, PDF, Word (doc/docx), Excel
        (xls/xlsx), CSV, plain text (422 otherwise).

        A request whose `Content-Length` alone is past what those limits could
        ever allow is refused with 413 `payload_too_large` **before the body is
        read**, so a client that streams a huge upload sees the rejection early
        rather than after the transfer. Same code and status as the per-file
        check — nothing new to handle. The created attachments
        are also embedded on the transaction (`Transaction.attachments`) from
