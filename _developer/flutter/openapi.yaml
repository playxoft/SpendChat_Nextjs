  /api/v1/file-shares:
    get:
      tags: [Files]
      summary: List active share links for one file or folder (editor only)
      description: |
        Exactly one of `?fileId=` / `?folderId=`, newest first. Editor only —
        tokens grant public access, so viewers can't read them.

        Passing neither or **both** is a 422 — a two-target query is answered
        for neither, never silently for one of them.

        Only **active** links are returned: a link whose `expiresAt` has passed
        is omitted, because its token no longer resolves on the share page.
      parameters:
        - $ref: "#/components/parameters/workspaceHeader"
        - name: fileId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: folderId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The links.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/FileShare" }
                required: [data]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [Files]
      summary: Create a public share link for one file or folder (editor only)
      description: |
        Exactly one of `fileId` / `folderId`. The returned `token` IS the
        capability — anyone with the link sees the content, so treat it like a
        secret. Build the shareable web link as `<web-origin><sharePath>`
        (e.g. `https://spendchat.example.com/share/aBc…`). A folder link shares
        the folder's whole subtree. `allowDownload: false` makes a view-only
        link: the share page serves only what a browser renders in place —
        previewable documents and playable media — and refuses everything else
        with a 403, since "previewing" a container no engine decodes just saves
        the file. `expiresInDays` omitted/null = never expires. The predefined
        folder can't be shared (400).
      parameters:
        - $ref: "#/components/parameters/workspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FileShareInput" }
      responses:
        "201":
          description: The created link.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/FileShare" } }
                required: [data]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

