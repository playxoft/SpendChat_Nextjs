                  meta:
                    type: object
                    properties: { currency: { $ref: "#/components/schemas/CurrencyMeta" } }
                required: [data, meta]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/ai/parse:
    post:
      tags: [AI]
      summary: Parse a free-text note into transaction drafts (editor only)
      description: |
        Turns a note like "200 fruits, 100 veg, 1000 electricity, got 5000
        salary" into structured drafts. **Nothing is written** — show the
        drafts for the user to review/edit, then commit the kept ones via
        `POST /transactions/bulk` (map each draft to a `TransactionInput`:
        `type`, `amount`, `title`, `description`, `categoryId`, `occurredOn`).

        Hints the model honours (worth surfacing in the app's UI help):
        `/CategoryName` picks a category (a slash followed by a letter; a slash
        between digits is a date), `#TagName` tags the transaction (a hash
        followed by a letter; `#1` is not a tag) and may repeat,
        `(parentheses)` become the description, relative dates ("yesterday",
        "last Friday") resolve against `timezone`.

        `timezone` (IANA, e.g. `Asia/Kolkata`) anchors "today" for those
        relative dates; omitted → UTC. Send the device zone. Drafts never get
        a future date; `categoryId`/`categoryName` are guaranteed to be an
        existing workspace category of the draft's type, or null. `tagIds` are
        always existing workspace tags — the model is given the workspace's list
        and a name outside it is dropped, never created. Since 6.4.0 they are
        **inferred as well as asked for**: a "#Tag" marker is still honoured
        exactly, and beyond that the model applies any workspace tag that
        clearly fits, the way it already picks a category. Present the drafts
        for review — a tag the user did not ask for is theirs to remove.

        **Cost (6.5.0).** A parse costs one AI action from the workspace's
        monthly allowance. `source: "voice"` marks a note that is a transcript
        from `POST /ai/transcribe` — the clip already paid for its parse, so
        the call is free when the caller has an unclaimed paid transcription
        in this workspace from the last 15 minutes (each paid clip covers one
        such parse), and is charged like a typed note otherwise. `source`
        omitted means `typed`; any other value is a 422.

        Gates, in order: 422 (bad `source`), 400 (empty or > 3000-char note,
        bad timezone), 403 `forbidden` (viewer in this workspace),
        429 (shared 30/hour AI quota), 403 `plan_limit` with
        `limit: "aiActions"` once the workspace's monthly allowance is spent
        (`max` = the allowance, `used` = actions counted this month; it
        refills on `GET /usage` → `ai.resetsAt`), 503 (parse model not
        configured), 502 (provider failed — the action is given back). At
        most 50 drafts per call; a note that yields nothing usable is a 400.
      parameters:
        - $ref: "#/components/parameters/workspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiParseInput" }
      responses:
        "200":
          description: The parsed drafts, for user review.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      drafts:
                        type: array
                        maxItems: 50
                        items: { $ref: "#/components/schemas/AiDraft" }
                      today:
                        type: string
                        format: date
                        description: The date the server treated as "today" (in the supplied timezone).
                    required: [drafts, today]
                required: [data]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOrPlanLimit" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/AiFailed" }
        "503": { $ref: "#/components/responses/AiUnavailable" }

  /api/v1/ai/transcribe:
    post:
      tags: [AI]
      summary: Transcribe a voice note to text (multipart, editor only)
      description: |
        Turns a short voice recording into the text of a note. Returns **only a
        transcript** — put it in the composer for the user to read and fix,
        then send it through `POST /ai/parse` like a typed note. The audio is
        transcribed and discarded; nothing is stored.

        Multipart form data: the recording under `audio`, and its length in
        milliseconds under `durationMs` (6.5.0). The audio part should carry
        its content type; if your HTTP client drops it, send a `mimeType` text
        field as fallback. Accepted containers: `audio/webm`, `audio/ogg`,
        `audio/mp4` (AAC/M4A), `audio/mpeg`, `audio/wav`, `audio/x-wav`,
        `audio/x-m4a`. Max 4 MB, and recordings up to **2 minutes** (cap them
        at 120 s client-side; it was 60 s before 6.5.0). Amounts come back as
        digits ("two fifty" → 250, "2 lakh" → 200000); spoken languages are
        transcribed as spoken (never translated), guided by the user's
        `voiceLanguages` setting.

        **Plan and cost (6.5.0).** Voice entry is a **Pro** feature
        (`GET /usage` → `voice`); elsewhere this is `403 plan_limit` with
        `limit: "voice"`. A clip costs **one AI action per started minute** of
        `durationMs` (clamped to 120000), so a 61-second clip costs two; a
        request without `durationMs` is charged as a full two-minute clip, so
        always send it. That charge also covers parsing the transcript — send
        it to `/ai/parse` with `source: "voice"` within 15 minutes.

        Gates, in order: 413 (the request body's `Content-Length` alone is past
        the 4 MB cap — refused before the body is read), 400 (missing/empty/
        oversized/unsupported audio, a malformed or negative `durationMs`, or
        no speech heard), 403 `forbidden` (viewer in this workspace),
        403 `plan_limit` `voice`, 429 (shared 30/hour AI quota), 403
        `plan_limit` `aiActions` (monthly allowance spent), 503 (transcribe
        model not configured), 502 (provider failed — the actions are given
        back).

        The 413 and the 400 report the same thing — a recording over 4 MB — and
        differ only in whether the client declared the size up front. A client
        that sends `Content-Length` gets the 413 without uploading; one that
        streams without it uploads and gets the 400. Handle both as "recording
        too long".
      parameters:
        - $ref: "#/components/parameters/workspaceHeader"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                audio: { type: string, format: binary }
                mimeType:
                  type: string
                  description: Fallback content type when the audio part has none.
                durationMs:
                  type: integer
                  minimum: 0
                  description: >
                    The clip's length in milliseconds (6.5.0) — what the charge
                    is computed from (one AI action per started minute; values
                    above 120000 are clamped). Omitted or blank → charged as a
                    full two-minute clip. Not a non-negative number → 400.
                  example: 42000
              required: [audio]
      responses:
        "200":
          description: The transcript (≤ 2400 chars), ready for the composer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      text: { type: string, maxLength: 2400 }
                    required: [text]
                required: [data]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOrPlanLimit" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/AiFailed" }
        "503": { $ref: "#/components/responses/AiUnavailable" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase ID token (from firebase_auth's getIdToken()).

  parameters:
    workspaceHeader:
      name: X-Workspace-Id
      in: header
      required: false
      description: >
        Selects the workspace to scope reads/creates to. If omitted, the server
        uses the user's lastWorkspaceId, else the first accessible workspace.
        An unknown id → 404.
      schema: { type: string, format: uuid }
    clientPlatformHeader:
      name: X-Client-Platform
      in: header
      required: false
      description: >
        Optional telemetry header, accepted on every request. Identifies the
        client platform for server-side logging only — it never affects the
        response. Send "android" or "ios"; unknown/absent values are logged as
        "api".
      schema: { type: string, enum: [android, ios, web] }
    id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    type:
      name: type
      in: query
      required: false
      schema: { type: string, enum: [income, expense] }
    category:
      name: category
      in: query
      required: false
      description: Category id, or "all" (no filter).
      schema: { type: string }
    profile:
      name: profile
      in: query
      required: false
      description: Profile id (a UUID scopes to it), or "all"/omitted for every accessible profile.
      schema: { type: string }
    from:
      name: from
      in: query
      required: false
      description: Inclusive start date, YYYY-MM-DD.
      schema: { type: string, format: date }
    to:
      name: to
      in: query
      required: false
      description: Inclusive end date, YYYY-MM-DD.
      schema: { type: string, format: date }
    q:
      name: q
      in: query
      required: false
      description: Free-text search over title + description (ILIKE). Does not match tag names.
      schema: { type: string }
    tags:
      name: tags
      in: query
      required: false
      description: >
        Comma-separated tag ids. Matches transactions carrying **any** of them
        (overlap, not "all of them"). Ids are deduped, segments that are not
        UUIDs are dropped rather than rejected, and the list is capped at 10 —
        so a malformed value narrows oddly rather than erroring. Omit, or pass
        an empty value, for no tag filter.
      example: "0199a0d1-0000-7000-8000-000000000001,0199a0d1-0000-7000-8000-000000000002"
      schema: { type: string }
    limit:
      name: limit
      in: query
      required: false
      description: Page size (default 100, clamped 1–500). Invalid values fall back to 100.
      schema: { type: integer, default: 100, minimum: 1, maximum: 500 }
    offset:
      name: offset
      in: query
      required: false
      schema: { type: integer, default: 0, minimum: 0 }

  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: unauthorized, message: "Missing bearer token" } }
    Forbidden:
      description: >
        Email not verified, or RBAC role too low for the action. A write into
        a view-only workspace (an extra free workspace whose owner has an
        older free one) is answered with code `plan_limit` and `details.limit:
        "freeWorkspaces"` instead — see `ForbiddenOrPlanLimit`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: forbidden, message: "Email not verified" } }
    ForbiddenOrPlanLimit:
      description: >
        Either `forbidden` (email not verified, role too low) or `plan_limit`
        — the workspace's plan doesn't allow this (a cap is reached, or the
        feature belongs to a higher plan). Branch on `error.code`; for
        `plan_limit`, `details` is a `PlanLimitDetails` and the message is
        safe to display as-is.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            forbidden:
              value: { error: { code: forbidden, message: "You don't have permission to do that" } }
            plan_limit:
              value:
                error:
                  code: plan_limit
                  message: "This workspace's Free plan includes 2 spaces. Upgrade to Plus for 6 spaces."
                  details: { limit: spaces, plan: free, max: 2, used: 2, upgradeTo: plus }
    BadRequest:
      description: Malformed request (e.g. invalid JSON, wrong confirm string).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource/workspace/profile not found or not accessible.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: not_found, message: "Transaction not found" } }
    Conflict:
      description: Conflicts with current state (duplicate name; last/non-empty profile).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: conflict, message: "A category with that name already exists" } }
    ValidationError:
      description: Input failed validation. `details` maps field → message.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: validation_error
              message: "Amount must be greater than 0"
              details: { amount: "Amount must be greater than 0" }
    RateLimited:
      description: The caller spent the shared per-user AI quota (30 calls/hour).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: rate_limited, message: "That's a lot of AI requests in the last hour — try again later" } }
    AiUnavailable:
      description: This AI feature's model isn't configured on the server (feature is off).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: ai_unavailable, message: "AI-assisted input isn't available right now." } }
    AiFailed:
      description: The upstream model provider failed; retrying may succeed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: ai_failed, message: "Couldn't reach the AI just now — please try again." } }
    StorageUnavailable:
      description: File storage (R2) isn't configured on the server.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: storage_unavailable, message: "File storage isn't configured on this server." } }
    PayloadTooLarge:
      description: >
        The upload doesn't fit: either a single file exceeds the per-file cap
        (5 MB — `payload_too_large`), or the batch would push the workspace
        past its plan's storage (1 / 5 / 20 GB — `storage_quota_exceeded`;
        the message says how much space remains and is safe to display as-is,
        and `details` is a `PlanLimitDetails` with `limit: "storage"`, `max`
        = the quota in bytes and `used` = bytes already stored).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            payload_too_large:
              value: { error: { code: payload_too_large, message: "Each file must be 5 MB or smaller." } }
            storage_quota_exceeded:
              value:
                error:
                  code: storage_quota_exceeded
                  message: "Not enough storage left — this upload needs 3.2 MB but only 1.1 MB of the 1.0 GB remains. Upgrade to Plus for 5.0 GB."
                  details: { limit: storage, plan: free, max: 1073741824, used: 1072578560, upgradeTo: plus }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum: [unauthorized, forbidden, plan_limit, bad_request, not_found,
                     conflict, validation_error, rate_limited, payload_too_large,
                     storage_quota_exceeded, ai_unavailable, ai_failed,
                     storage_unavailable, internal_error]
            message: { type: string }
            details:
              description: >
                Optional. For `validation_error`, a flat `{ field: message }`
                map. For `plan_limit` and `storage_quota_exceeded`, a
                `PlanLimitDetails` object.
              oneOf:
                - type: object
                  additionalProperties: { type: string }
                - $ref: "#/components/schemas/PlanLimitDetails"
          required: [code, message]
      required: [error]

    Plan:
      type: string
      description: A workspace's plan. Every limit belongs to the workspace and is shared by everyone in it.
      enum: [free, plus, pro]

    PlanLimitKey:
      type: string
      description: >
        Which limit a `plan_limit` (or `storage_quota_exceeded`) error is
        about — pick the upgrade copy from it. `members`: people in the
        workspace (invites count; enforced by the web's invite flow).
        `spaces`, `profilesPerSpace`, `categories`, `tags`: counted caps.
        `storage`: bytes (on 413 `storage_quota_exceeded`). `aiActions`: the
        monthly AI allowance. `voice`: voice entry isn't on this plan.
        `profileLevelAccess`: per-profile overrides need Plus/Pro.
        `freeWorkspaces`: one free workspace per person — creating another, or
        writing into an extra one that is view-only.
      enum: [members, spaces, profilesPerSpace, categories, tags, storage,
             aiActions, voice, profileLevelAccess, freeWorkspaces]

    PlanLimitDetails:
      type: object
      description: >
        `details` of a `403 plan_limit` error (and of a
        `413 storage_quota_exceeded`). Stable and machine-readable, so a
        client can show an upgrade prompt instead of a generic "not allowed".
      properties:
        limit: { $ref: "#/components/schemas/PlanLimitKey" }
        plan:
          description: The workspace's plan right now.
          allOf: [{ $ref: "#/components/schemas/Plan" }]
        max:
          type: integer
          format: int64
          description: The cap that was hit, when it's a number (bytes for `storage`). Absent for feature gates.
        used:
          type: integer
          format: int64
          description: How much is in use, when it's a number. Absent for feature gates.
        upgradeTo:
          description: The cheapest plan that lifts this limit; null when none does ("contact us").
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Plan"
      required: [limit, plan, upgradeTo]

    VersionInfo:
      type: object
      description: >
        Deliberately limited to public, non-sensitive facts (the source is AGPL
        and on GitHub): no dependency versions, hostnames, regions, env var
        names, or database/storage state.
      properties:
        name:
          type: string
          description: Product name.
          example: SpendChat
        version:
          type: string
          description: >
            The deployed **server/web** release (package.json + CHANGELOG.md) —
            not the mobile app's own version.
          example: "0.1.0"
        apiVersion:
          type: string
          description: Version of this `/api/v1` contract (= `info.version`).
          example: "5.6.0"
        environment:
          type: string
          enum: [production, beta, development]
          description: Which deployment answered. Anything unrecognized reads as "development".
        build:
          description: >
            Identity of the deployed Cloudflare Worker version. **Nullable** —
            null on a local run and on any deploy that predates the
            version-metadata binding, so treat it as optional.
          oneOf:
            - type: "null"
            - type: object
              properties:
                id:
                  type: string
                  description: Worker version id — quote it in a bug report.
                  example: c9a1f0d2-1b4e-4a77-9d2e-0c3b6f5a8e11
                deployedAt:
                  type: [string, "null"]
                  format: date-time
                  description: When that version was uploaded; null if the runtime gave no parseable timestamp.
              required: [id, deployedAt]
        changelog:
          type: object
          description: Where to read what changed (deep-link these from an about screen).
          properties:
            app:
              type: string
              format: uri
              description: CHANGELOG.md for the `version` field.
            api:
              type: string
              format: uri
              description: The `/api/v1` changelog for the `apiVersion` field.
          required: [app, api]
      required: [name, version, apiVersion, environment, build, changelog]

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: [string, "null"] }
        name: { type: [string, "null"] }
      required: [id, email, name]

    WorkspaceSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        icon:
          type: [string, "null"]
          description: Emoji shown beside the workspace name; null when unset.
          example: "🏢"
        role:
          description: Effective role in this workspace; null when access is via a per-profile grant only.
          oneOf:
            - type: "null"
            - type: string
              enum: [viewer, editor, admin]
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        locale: { type: string, example: en-US }
        currencyDetail: { $ref: "#/components/schemas/CurrencyMeta" }
        plan:
          description: The workspace's plan (6.5.0). Limits are per workspace — see `GET /usage`.
          allOf: [{ $ref: "#/components/schemas/Plan" }]
        organizationId:
          type: string
          format: uuid
          description: The organisation that holds the workspace (6.5.0).
      required: [id, name, icon, role, currency, locale, currencyDetail, plan,
                 organizationId]

    WorkspaceInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 30
          description: Workspace name (trimmed server-side).
        icon:
          type: string
          maxLength: 16
          description: Optional emoji for the workspace. Omitted/empty seeds the default (🏢).
          example: "🏢"
      required: [name]

    CurrencyMeta:
      type: object
      description: Enough to format minor-unit amounts client-side.
      properties:
        code: { type: string, example: USD }
        symbol: { type: string, example: "$" }
        decimals: { type: integer, example: 2 }
      required: [code, symbol, decimals]

    Settings:
      type: object
      description: >
        User settings that follow the user across every workspace. Currency and
        number format are per-workspace (see WorkspaceSummary), not here.
      properties:
        theme: { type: string, enum: [light, dark, system] }
        inputMode: { type: string, enum: [amount_title, title_amount, combined] }
        voiceLanguages:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: "#/components/schemas/VoiceLanguageCode" }
          description: >
            Languages voice entry tells the transcription model to expect (a
            list, so code-mixed speech works). Normalized server-side; never
            empty (default ["en"]).
      required: [theme, inputMode, voiceLanguages]

    SettingsPatch:
      type: object
      minProperties: 1
      description: Any subset; at least one property required.
      properties:
        theme: { type: string, enum: [light, dark, system] }
        inputMode: { type: string, enum: [amount_title, title_amount, combined] }
        voiceLanguages:
          type: array
          maxItems: 20
          items: { type: string, minLength: 2, maxLength: 8 }
          description: >
            ISO 639-1 codes from the supported catalogue (see
            VoiceLanguageCode). Normalized server-side rather than rejected:
            unknown codes are dropped, duplicates removed, the list capped at
            5, and an empty/all-unknown list falls back to the default ["en"].
            The response carries the normalized result.

    WorkspaceCurrencyPatch:
      type: object
      description: Update a workspace's currency + number format (admin only).
      properties:
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        locale: { type: string, minLength: 2, maxLength: 20 }
      required: [currency, locale]

    CurrencyCode:
      type: string
      description: One of the 59 supported ISO 4217 codes.
      enum: [USD, EUR, GBP, INR, JPY, CAD, AUD, SGD, AED, CHF, CNY, BRL, ZAR, NGN,
             HKD, NZD, SEK, NOK, DKK, ISK, PLN, CZK, HUF, RON, BGN, TRY, RUB, UAH,
             ILS, SAR, QAR, KWD, BHD, OMR, JOD, EGP, KES, GHS, MAD, TZS, UGX, ETB,
             PKR, BDT, LKR, NPR, THB, VND, IDR, MYR, PHP, KRW, TWD, MXN, ARS, CLP,
             COP, PEN, UYU]

    Transaction:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [income, expense] }
        amountMinor:
          type: integer
          description: Positive amount in the user's currency minor units (source of truth).
          example: 1250
        amount:
          type: string
          description: Same value in major units, formatted to the currency's decimals.
          example: "12.50"
        title: { type: [string, "null"] }
        description: { type: [string, "null"] }
        occurredOn: { type: string, format: date, example: "2026-06-01" }
        createdAt: { type: string, format: date-time }
        category:
          oneOf:
            - type: "null"
            - type: object
              properties:
                id: { type: string, format: uuid }
                name: { type: [string, "null"] }
                icon: { type: [string, "null"] }
              required: [id, name, icon]
        profile:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: [string, "null"] }
            icon: { type: [string, "null"] }
          required: [id, name, icon]
        user:
          type: object
          description: >
            Author attribution — who entered the row. Matters in shared
            workspaces (show it WhatsApp-group style when the workspace has
            more than one user; hide it in a solo workspace).
          properties:
            id: { type: string, format: uuid }
            name: { type: [string, "null"] }
            email: { type: [string, "null"] }
          required: [id, name, email]
        attachments:
          type: array
          description: >
            Files attached to the transaction, oldest first. Empty array when
            none; `attachments.length` drives the 📎 indicator. Fetch bytes via
            GET /attachments/{id}/url.
          items: { $ref: "#/components/schemas/Attachment" }
        tags:
          type: array
          description: >
            The tags on this transaction, resolved to the workspace's tag
            entities and ordered by name. Empty array when none. Tags are
            workspace-scoped and shared by every member, like categories; apply
            them by sending `tagIds` on create/update.
          items: { $ref: "#/components/schemas/Tag" }
      required: [id, type, amountMinor, amount, title, description, occurredOn,
                 createdAt, category, profile, user, attachments, tags]

    TransactionInput:
      type: object
      properties:
        type: { type: string, enum: [income, expense] }
        amount:
          type: number
          description: Positive major-unit amount (e.g. 12.50). Numeric strings are coerced. Converted to minor units server-side. Whole-number part capped at 9 digits.
          exclusiveMinimum: 0
          maximum: 999999999.99
        categoryId:
          type: [string, "null"]
          format: uuid
          description: Must belong to the caller; an unknown id is stored as null.
        profileId:
          type: [string, "null"]
          format: uuid
          description: Must be writable by the caller; an unknown/absent id uses the default (first writable) profile.
        title: { type: string, maxLength: 40 }
        description: { type: string, maxLength: 150 }
        note:
          type: string
          maxLength: 40
          deprecated: true
          description: Deprecated alias for `title`. Use `title`.
        occurredOn: { type: string, format: date, example: "2026-06-01" }
        tagIds:
          type: array
          maxItems: 10
          description: >
            Tag ids to put on the transaction. Duplicates are collapsed, and ids
            that don't belong to the caller's workspace are dropped rather than
            rejected (same rule as `categoryId`). On PATCH, **omitting this
            field leaves the row's tags unchanged** — send an empty array to
            clear them.
          items: { type: string, format: uuid }
      required: [type, amount, occurredOn]

    Tag:
      type: object
      description: >
        A workspace-scoped label that can be put on any number of transactions,
        and which any number of transactions can carry. `color` is a 6-digit hex
        (`#rrggbb`) drawn from a fixed 20-swatch palette.
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 20 }
        color: { type: string, example: "#ef4444" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, name, color, createdAt, updatedAt]

    TagInput:
      type: object
      description: >
        A new tag. `color` must be a 6-digit hex (`#rrggbb`); the 20-swatch
        palette the apps offer is a UI convention, not a server constraint, so
        any hex is accepted and stored lowercased.
      properties:
        name: { type: string, minLength: 1, maxLength: 20 }
        color: { type: string, pattern: "^#[0-9a-fA-F]{6}$", example: "#ef4444" }
      required: [name, color]

    TagUpdate:
      type: object
      description: >
        A partial update — send only what changes. An empty body is a 422
        rather than a no-op that bumps `updatedAt`.
      properties:
        name: { type: string, minLength: 1, maxLength: 20 }
        color: { type: string, pattern: "^#[0-9a-fA-F]{6}$", example: "#ef4444" }
      minProperties: 1

    Category:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [income, expense] }
        icon: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, name, kind, icon, createdAt, updatedAt]

    CategoryInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 20 }
        kind: { type: string, enum: [income, expense] }
        icon: { type: string, maxLength: 16 }
      required: [name, kind]

    CategoryUpdate:
      type: object
      description: Any subset of the mutable fields.
      properties:
        name: { type: string, minLength: 1, maxLength: 20 }
        icon: { type: [string, "null"], maxLength: 16 }

    Profile:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        icon: { type: [string, "null"] }
        color: { type: [string, "null"], description: Exists in the schema but no UI sets it. }
        sortOrder: { type: integer }
        spaceId:
          type: string
          format: uuid
          description: The space the profile lives in (6.5.0).
        access: { $ref: "#/components/schemas/ProfileAccess" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, name, icon, color, sortOrder, spaceId, access, createdAt, updatedAt]

    ProfileAccess:
      type: string
      description: >
        The caller's effective access on a profile (6.5.0): `read` (viewer —
        see it), `write` (editor — add/edit its transactions and files),
        `admin` (manage the profile). Resolved from the workspace role, the
        space role, any per-profile override and any per-profile grant. In a
        view-only workspace every profile is `read`.
      enum: [read, write, admin]

    ProfileInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 20 }
        icon: { type: string, maxLength: 16 }
        color: { type: string, maxLength: 32 }
        spaceId:
          type: string
          format: uuid
          description: >
            The space to create it in (6.5.0) — a space of the current
            workspace (404 otherwise). Omitted → the workspace's first space.
      required: [name]

    ProfileUpdate:
      type: object
      description: Any subset of the mutable fields.
      properties:
        name: { type: string, minLength: 1, maxLength: 20 }
        icon: { type: [string, "null"], maxLength: 16 }
        color: { type: [string, "null"], maxLength: 32 }

    ProfileDeletionImpact:
      type: object
      description: >
        What a profile delete would take with it, for the confirm step. All
        three counts follow the caller's disposal: destroyed on
        `transactions=delete`, re-filed on `transactions=move`.
      properties:
        transactions:
          type: integer
          description: Transactions filed under the profile — deletable or movable.
        files:
          type: integer
          description: >
            Vault files stored under the profile. Deleted with it, or moved
            with it — the vault follows the same choice as the transactions.
        attachments:
          type: integer
          description: >
            Receipts attached to those transactions. Counted separately from
            `files` because they are a different thing to the user. A profile
            can hold no vault files and dozens of receipts, or no transactions
            and a full vault, so a dialog that reads only one of the three
            under-reports what it is about to act on.
      required: [transactions, files, attachments]

    ProfileSpaceMove:
      type: object
      properties:
        spaceId: { type: string, format: uuid, description: The destination space (same workspace). }
      required: [spaceId]

    ProfileAccessLevel:
      type: string
      description: >
        A per-profile override: `none` hides the profile from the member even
        inside their space; `read` / `write` give view / edit access even in a
        space they're not in.
      enum: [none, read, write]

    ProfileOverride:
      type: object
      properties:
        userId: { type: string, format: uuid }
        access: { $ref: "#/components/schemas/ProfileAccessLevel" }
      required: [userId, access]

    ProfileOverrideInput:
      type: object
      properties:
        userId:
          type: string
          format: uuid
          description: A non-admin member of the profile's workspace.
        access:
          description: The override to set, or null to clear it (back to the space role).
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/ProfileAccessLevel"
      required: [userId, access]

    Space:
      type: object
      description: A space — the middle of workspace → space → profile, and the unit of sharing (6.5.0).
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 30 }
        icon: { type: [string, "null"], example: "🗂️" }
        position: { type: integer, description: Sidebar order within the workspace. }
        profileCount:
          type: integer
          description: >
            Every profile in the space — what the per-space cap counts — not
            just the ones the caller can see.
        role:
          description: >
            The caller's role here: `admin` for workspace admins (they see
            every space); otherwise their space role, or null when the space
            is visible only because they reach one of its profiles another way
            (an override or a per-profile grant).
          oneOf:
            - type: "null"
            - type: string
              enum: [viewer, editor, admin]
      required: [id, name, icon, position, profileCount, role]

    SpaceInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 30, description: Unique per workspace; trimmed. }
        icon: { type: string, maxLength: 16, description: Optional emoji. }
      required: [name]

    SpaceUpdate:
      type: object
      description: At least one of `name` / `icon`.
      properties:
        name: { type: string, minLength: 1, maxLength: 30 }
        icon: { type: [string, "null"], maxLength: 16, description: '"" or null clears it.' }

    SpaceReorder:
      type: object
      properties:
        ids:
          type: array
          description: The workspace's space ids in their new order (no duplicates).
          items: { type: string, format: uuid }
          minItems: 1
          maxItems: 200
      required: [ids]

    SpaceDeleteInput:
      type: object
      description: Optional body of `DELETE /spaces/{id}`.
      properties:
        moveProfilesTo:
          type: string
          format: uuid
          description: Where this space's profiles go. Required when it has any.

    SpaceMemberInput:
      type: object
      properties:
        userId:
          type: string
          format: uuid
          description: A non-admin member of the workspace.
        role:
          description: Their role in this space, or null to take them out of it.
          oneOf:
            - type: "null"
            - type: string
              enum: [viewer, editor]
      required: [userId, role]

    SpaceAccess:
      type: object
      description: The "Members & access" view of one space (admin only).
      properties:
        space:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            icon: { type: [string, "null"] }
            workspaceId: { type: string, format: uuid }
          required: [id, name, icon, workspaceId]
        members:
          type: array
          description: Every workspace member, the owner first.
          items:
            type: object
            properties:
              userId: { type: string, format: uuid }
              name: { type: [string, "null"] }
              email: { type: [string, "null"] }
              workspaceRole: { type: string, enum: [viewer, editor, admin] }
              spaceRole:
                description: Their role in this space; null when not in it — and always null for admins, who see every space.
                oneOf:
                  - type: "null"
                  - type: string
                    enum: [viewer, editor]
              isOwner: { type: boolean }
            required: [userId, name, email, workspaceRole, spaceRole, isOwner]
        profiles:
          type: array
          description: The space's profiles, in sidebar order.
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              icon: { type: [string, "null"] }
            required: [id, name, icon]
        overrides:
          type: array
          description: Per-profile overrides on this space's profiles (members only).
          items:
            type: object
            properties:
              profileId: { type: string, format: uuid }
              userId: { type: string, format: uuid }
              access: { $ref: "#/components/schemas/ProfileAccessLevel" }
            required: [profileId, userId, access]
        canEditOverrides:
          type: boolean
          description: Whether the plan lets overrides be changed (Plus/Pro). Existing ones always apply.
      required: [space, members, profiles, overrides, canEditOverrides]

    Organization:
      type: object
      description: The caller's personal organisation (6.5.0).
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 40 }
        kind: { type: string, enum: [personal, business], description: Always `personal` today. }
        owner:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: [string, "null"] }
            email: { type: [string, "null"] }
          required: [id, name, email]
        workspaces:
          type: array
          description: The workspaces in the organisation, oldest first.
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              icon: { type: [string, "null"] }
              plan: { $ref: "#/components/schemas/Plan" }
              readOnly:
                type: boolean
                description: An extra free workspace (the owner has an older free one) — view-only until it upgrades.
              canOpen:
                type: boolean
                description: Whether the caller can open it (send it as `X-Workspace-Id`).
            required: [id, name, icon, plan, readOnly, canOpen]
      required: [id, name, kind, owner, workspaces]

    OrganizationPatch:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 40, description: Trimmed. }
      required: [name]

    Meter:
      type: object
      description: A counted limit — how much is in use against the plan's cap.
      properties:
        used: { type: integer }
        limit: { type: integer }
      required: [used, limit]

    Usage:
      type: object
      description: >
        The current workspace's plan, limits and usage (6.5.0). Limits gate
        adding, never existing data, so `used` can exceed `limit` (after a
        downgrade) — it just can't add more until it's back under.
      properties:
        plan: { $ref: "#/components/schemas/Plan" }
        readOnly:
          type: boolean
          description: >
            An extra free workspace (its owner has an older free one):
            view-only. Writes inside a profile and adds of profiles, spaces,
            categories and tags get `403 plan_limit` (`freeWorkspaces`).
        ai:
          type: object
          description: The monthly AI allowance (parse + transcribe), shared by the workspace.
          properties:
            used: { type: integer, description: AI actions counted this calendar month (UTC). }
            limit: { type: integer, description: The plan's monthly allowance. }
            remaining: { type: integer, description: "max(0, limit - used)." }
            topUpRemaining: { type: integer, description: Top-up actions left (0 until top-ups exist). }
            resetsAt: { type: string, format: date-time, description: When the allowance refills — the first instant of next month (UTC). }
          required: [used, limit, remaining, topUpRemaining, resetsAt]
        storage:
          type: object
          description: Vault files + transaction attachments, workspace-wide (same as `GET /files` → `meta.storage`).
          properties:
            usedBytes: { type: integer, format: int64 }
            limitBytes: { type: integer, format: int64 }
          required: [usedBytes, limitBytes]
        members:
          description: People with access, the owner and pending invites included.
          allOf: [{ $ref: "#/components/schemas/Meter" }]
        spaces: { $ref: "#/components/schemas/Meter" }
        categories:
          description: The 10 seeded default categories count.
          allOf: [{ $ref: "#/components/schemas/Meter" }]
        tags:
          description: The 2 seeded default tags count.
          allOf: [{ $ref: "#/components/schemas/Meter" }]
        profilesPerSpace:
          type: integer
          description: The per-space profile cap (compare with each `Space.profileCount`).
        voice: { type: boolean, description: Whether voice entry (`POST /ai/transcribe`) is available. }
        profileLevelAccess: { type: boolean, description: Whether per-profile overrides can be changed (Plus/Pro). }
      required: [plan, readOnly, ai, storage, members, spaces,
                 categories, tags, profilesPerSpace, voice, profileLevelAccess]

    Summary:
      type: object
      description: All values are minor units.
      properties:
        income: { type: integer }
        expense: { type: integer }
        balance: { type: integer, description: income - expense }
      required: [income, expense, balance]

    CategoryBreakdownItem:
      type: object
      properties:
        categoryId: { type: [string, "null"], format: uuid }
        categoryName: { type: [string, "null"] }
        categoryIcon: { type: [string, "null"] }
        total: { type: integer, description: Minor units. }
      required: [categoryId, categoryName, categoryIcon, total]

    MonthlyPoint:
      type: object
      properties:
        month: { type: string, example: "2026-06", description: "YYYY-MM" }
        income: { type: integer, description: Minor units. }
        expense: { type: integer, description: Minor units. }
      required: [month, income, expense]

    DeletedResult:
      type: object
      properties:
        id: { type: string, format: uuid }
        deleted: { type: boolean, enum: [true] }
      required: [id, deleted]

    Attachment:
      type: object
      description: Attachment metadata. The bytes live in object storage — fetch via GET /attachments/{id}/url.
      properties:
        id: { type: string, format: uuid }
        transactionId: { type: string, format: uuid }
        fileName: { type: string, maxLength: 200, description: Sanitized original filename. }
        contentType:
          type: string
          description: Canonical MIME type (from the upload allowlist).
          enum: [image/jpeg, image/png, image/webp, image/gif, application/pdf,
                 application/msword,
                 application/vnd.openxmlformats-officedocument.wordprocessingml.document,
                 application/vnd.ms-excel,
                 application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,
                 text/csv, text/plain]
        sizeBytes: { type: integer, maximum: 5242880 }
        kind:
          description: Optional preset tag.
          oneOf:
            - type: "null"
            - type: string
              enum: [receipt, bill, invoice, other]
        label:
          type: [string, "null"]
          maxLength: 80
          description: Optional custom display name; fall back to fileName when null.
        hasThumbnail:
          type: boolean
          description: True when a small preview object exists (image uploads that sent one) — fetch it with ?variant=thumb.
        createdAt: { type: string, format: date-time }
      required: [id, transactionId, fileName, contentType, sizeBytes, kind, label, hasThumbnail, createdAt]

    AttachmentMetaPatch:
      type: object
      minProperties: 1
      description: Any subset; `null` clears a field.
      properties:
        label: { type: [string, "null"], maxLength: 80 }
        kind:
          oneOf:
            - type: "null"
            - type: string
              enum: [receipt, bill, invoice, other]

    AttachmentUrl:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: Presigned URL — GET it without the Authorization header.
        expiresInSeconds: { type: integer, example: 300 }
        fileName: { type: string }
        contentType: { type: string, description: image/webp when serving the thumb variant. }
      required: [url, expiresInSeconds, fileName, contentType]

    FileCategory:
      type: string
      description: Preset document categories for vault files.
      enum: [board-resolution, company, personal, land, house, certificate, other]

    VaultColor:
      type: string
      description: A hex accent color, `#rrggbb`. The web UI offers a fixed 20-swatch palette, but any hex is valid.
      pattern: "^#[0-9a-fA-F]{6}$"
      example: "#3b82f6"

    Folder:
      type: object
      description: >
        A vault folder. `system: true` marks the predefined per-profile
        "Transaction attachments" folder — recolor/tag only; never rename,
        move, delete, share, upload into, or nest under it.
      properties:
        id: { type: string, format: uuid }
        profileId: { type: string, format: uuid }
        parentId:
          type: [string, "null"]
          format: uuid
          description: null = a root folder.
        name: { type: string, maxLength: 40 }
        color:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/VaultColor"
          description: Accent hex, or null for the neutral default.
        tagIds:
          type: array
          items: { type: string, format: uuid }
          description: Applied tags (resolve against the tags list).
        system: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        createdByName:
          type: [string, "null"]
          description: Creator attribution (display only).
      required: [id, profileId, parentId, name, color, tagIds, system,
                 createdAt, updatedAt, createdByName]

    VaultFile:
      type: object
      description: >
        A vault file's metadata. The bytes live in object storage — fetch via
        GET /files/{id}/url. Unlike attachments there is no contentType
        allowlist; an unknown type is application/octet-stream.
      properties:
        id: { type: string, format: uuid }
        profileId: { type: string, format: uuid }
        folderId:
          type: [string, "null"]
          format: uuid
          description: null = the profile's root.
        name: { type: string, maxLength: 200, description: Sanitized display/file name. }
        contentType:
          type: string
          description: >-
            Resolved from the filename extension when the stored type is
            missing or application/octet-stream, so this is the file's real
            type even for files uploaded before that resolution existed.
        sizeBytes: { type: integer, maximum: 5242880 }
        category:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/FileCategory"
        tagIds:
          type: array
          items: { type: string, format: uuid }
        hasThumbnail:
          type: boolean
          description: True when a small preview object exists — fetch it with ?variant=thumb.
        createdAt: { type: string, format: date-time }
        uploaderName: { type: [string, "null"], description: Uploader attribution (display only). }
        profileName: { type: [string, "null"] }
        profileIcon: { type: [string, "null"] }
      required: [id, profileId, folderId, name, contentType, sizeBytes,
                 category, tagIds, hasThumbnail, createdAt, uploaderName,
                 profileName, profileIcon]

    TransactionFile:
      type: object
      description: >
        A transaction attachment as the vault surfaces it — the same attachment
        as Transaction.attachments, flattened with the transaction info needed
        to recognize it. `id` is the ATTACHMENT id: fetch bytes via
        GET /attachments/{id}/url. These render "inside" the predefined
        "Transaction attachments" folder and carry no tags.
      properties:
        id: { type: string, format: uuid }
        transactionId: { type: string, format: uuid }
        name: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer }
        hasThumbnail: { type: boolean }
        createdAt: { type: string, format: date-time }
        txnTitle: { type: [string, "null"] }
        txnType: { type: string, enum: [income, expense] }
        txnAmountMinor: { type: integer, description: Positive minor units; sign from txnType. }
        txnOccurredOn: { type: string, format: date }
        profileId: { type: string, format: uuid }
        profileName: { type: [string, "null"] }
        profileIcon: { type: [string, "null"] }
      required: [id, transactionId, name, contentType, sizeBytes, hasThumbnail,
                 createdAt, txnTitle, txnType, txnAmountMinor, txnOccurredOn,
                 profileId, profileName, profileIcon]

    FileTag:
      type: object
      description: A per-profile tag entity. Files/folders reference it via tagIds.
      properties:
        id: { type: string, format: uuid }
        profileId: { type: string, format: uuid }
        name: { type: string, maxLength: 20 }
        color: { $ref: "#/components/schemas/VaultColor" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, profileId, name, color, createdAt, updatedAt]

    FileShare:
      type: object
      description: >
        A public share link. The token IS the capability — treat it like a
        secret. The shareable web page is `<web-origin><sharePath>`.
      properties:
        id: { type: string, format: uuid }
        fileId: { type: [string, "null"], format: uuid }
        folderId: { type: [string, "null"], format: uuid }
        token: { type: string, maxLength: 64 }
        sharePath: { type: string, example: "/share/aBcD…" }
        allowDownload:
          type: boolean
          description: >-
            false = view-only link: recipients get inline previews of what the
            browser renders, and a 403 for anything else (no download UI, and
            no URL that would save the file instead).
        expiresAt:
          type: [string, "null"]
          format: date-time
          description: null = the link never expires.
        createdAt: { type: string, format: date-time }
      required: [id, fileId, folderId, token, sharePath, allowDownload,
                 expiresAt, createdAt]

    FolderInput:
      type: object
      properties:
        profileId: { type: string, format: uuid }
        parentId: { type: [string, "null"], format: uuid }
        name: { type: string, minLength: 1, maxLength: 40 }
        color:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/VaultColor"
        tagIds:
          type: array
          maxItems: 10
          items: { type: string, format: uuid }
      required: [profileId, name]

    FolderPatch:
      type: object
      minProperties: 1
      description: "Any subset. `parentId: null` moves to the root; `color: null` clears the accent."
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        color:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/VaultColor"
        tagIds:
          type: array
          maxItems: 10
          items: { type: string, format: uuid }
        parentId: { type: [string, "null"], format: uuid }

    VaultFilePatch:
      type: object
      minProperties: 1
      description: "Any subset. `folderId: null` moves the file to the root; `category: null` clears it."
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        category:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/FileCategory"
        tagIds:
          type: array
          maxItems: 10
          items: { type: string, format: uuid }
        folderId: { type: [string, "null"], format: uuid }

    FileTagInput:
      type: object
      properties:
        profileId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 20 }
        color: { $ref: "#/components/schemas/VaultColor" }
      required: [profileId, name, color]

    FileTagPatch:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 20 }
        color: { $ref: "#/components/schemas/VaultColor" }

    FileShareInput:
      type: object
      description: Exactly one of fileId / folderId.
      properties:
        fileId: { type: string, format: uuid }
        folderId: { type: string, format: uuid }
        allowDownload: { type: boolean, default: true }
        expiresInDays:
          type: [integer, "null"]
          minimum: 1
          maximum: 365
          description: Omitted/null = the link never expires.

    AiParseInput:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 3000
          description: The free-text note to parse (trimmed server-side). The cap was 2000 before 6.5.0.
        timezone:
          type: string
          description: IANA zone (e.g. Asia/Kolkata) anchoring "today" for relative dates. Send the device zone; omitted → UTC.
          example: Asia/Kolkata
        source:
          type: string
          enum: [typed, voice]
          default: typed
          description: >
            Where the note came from (6.5.0). `voice` = a transcript from
            `POST /ai/transcribe`: free when the caller has an unclaimed paid
            transcription in this workspace from the last 15 minutes, charged
            like `typed` (one AI action) otherwise. Any other value → 422.
      required: [text]

    AiDraft:
      type: object
      description: >
        One parsed transaction, for user review. Maps 1:1 onto a
        TransactionInput for POST /transactions/bulk (drop categoryName and
        tagNames, which are display conveniences; add profileId if the user
        picked a profile).
      properties:
        type: { type: string, enum: [income, expense] }
        amount:
          type: number
          description: Positive major-unit amount, within TransactionInput's limits.
          exclusiveMinimum: 0
          maximum: 999999999.99
        title:
          type: string
          maxLength: 40
          description: >
            Sentence-cased by the server ("banana" comes back "Banana"), so
            drafts read like hand-typed rows. Only the first character is
            touched — "iPhone case" and "AC repair" survive as typed.
        description:
          type: [string, "null"]
          maxLength: 150
          description: Sentence-cased the same way as title.
        categoryId:
          type: [string, "null"]
          format: uuid
          description: Resolved id of the matched workspace category (of the draft's type), or null when nothing fits.
        categoryName:
          type: [string, "null"]
          description: The matched category's exact stored name (display convenience; same match as categoryId).
        tagIds:
          type: array
          description: >
            Resolved ids of the workspace tags for this draft — pass straight
            through as `tagIds` on POST /transactions/bulk. Both the note's "#"
            markers and, since 6.4.0, tags the model inferred from the item.
            Empty when nothing fits. Added in 6.3.0.
          items: { type: string, format: uuid }
          maxItems: 10
        tagNames:
          type: array
          description: >
            The same tags by their exact stored names (display convenience; same
            match as tagIds). Added in 6.3.0.
          items: { type: string }
          maxItems: 10
        occurredOn:
          type: string
          format: date
          description: Defaults to "today" in the supplied timezone; never a future date.
      required: [type, amount, title, description, categoryId, categoryName, tagIds, tagNames, occurredOn]

    VoiceLanguageCode:
      type: string
      description: >
        ISO 639-1 codes voice entry supports (the settings picker's catalogue,
        ordered English first, then Indian languages, then the rest). en
        English, bn Bengali, gu Gujarati, hi Hindi, kn Kannada, ml Malayalam,
        mr Marathi, or Odia, pa Punjabi, ta Tamil, te Telugu, ur Urdu,
        ar Arabic, de German, es Spanish, fr French, id Indonesian, it Italian,
        ja Japanese, ko Korean, nl Dutch, pt Portuguese, ru Russian, th Thai,
        tr Turkish, vi Vietnamese, zh Chinese.
      enum: [en, bn, gu, hi, kn, ml, mr, or, pa, ta, te, ur, ar, de, es, fr,
             id, it, ja, ko, nl, pt, ru, th, tr, vi, zh]
